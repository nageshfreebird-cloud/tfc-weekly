<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessments Received � Teach for Change</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css" />
  <style>


    .btn-toggle {
      width: 100%;
      height: 80px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-toggle:hover:not(:disabled) {
      border-color: var(--primary);
    }
    .btn-toggle.received {
      background: var(--success);
      color: white;
      border-color: var(--success);
    }
    .btn-toggle.not-received {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }
    .btn-toggle:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Toggle menu">&#9776;</button>
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" width="72" height="36" loading="lazy" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime" style="display:flex; align-items:center; gap:1rem;">
    <span id="welcome-name" style="font-weight:600; color:#e2e8f0;"></span>
    <div>
      <span class="time-icon">🕒</span>
      <span id="live-clock">Loading...</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="color:var(--danger); border-color:var(--danger);">🚪 Logout</button>
  </div>
</nav>

<main class="page">
  <div class="container-wide" style="max-width: 1200px;">

        <!-- Sidebar Navigation -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
      <button class="sidebar-close" onclick="toggleSidebar()">&times;</button>
      <div class="sidebar-header">
        <img src="logo.png" alt="Logo" />
        <h2>Teach for Change</h2>
      </div>
      <div class="sidebar-nav">

      <a href="supervisor.html">🏠 Dashboard</a>
      <a href="team.html">📋 Weekly Tasks</a>
      <a href="supervisor-calls.html">📞 15-Days Teacher Calls</a>
      <a href="supervisor-assessments.html" class="active">📝 Assessments Received</a>
      <a href="supervisor-drive.html">📊 Assessment Entry</a>
      <a href="supervisor-sheets.html">🔗 Google Sheet Links</a>
    
      </div>
    </div>

    <div class="setup-panel">
      <h2>📝 Assessments Received</h2>
      <p class="text-muted mb-3" style="margin-bottom:1.5rem;">Select your district and level to log assessment collection status.</p>

      <div style="display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;">
        <div style="flex:1;">
          <label class="form-label">District</label>
          <select id="dist-select" class="form-control" onchange="loadSchools()">
            <option value="">Select District</option>
          </select>
        </div>
        <div style="flex:1;">
          <label class="form-label">Level</label>
          <select id="level-select" class="form-control" onchange="loadSchools()">
            <option value="">Select Level</option>
            <option value="Level-1">Level-1</option>
            <option value="Level-2">Level-2</option>
            <option value="Level-3">Level-3</option>
            <option value="Level-4">Level-4</option>
          </select>
        </div>
        <div style="flex:1;">
          <label class="form-label">Assessment</label>
          <select id="assessment-select" class="form-control" onchange="loadSchools()">
            <option value="">Select Assessment</option>
            <option value="baseline">Baseline</option>
            <option value="midline">Midline</option>
            <option value="endline">Endline</option>
          </select>
        </div>
      </div>

      <div id="schools-container" style="background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:1.5rem;min-height:300px;">
        <div class="text-muted text-center" style="margin-top:2rem;">Please select a district and level above.</div>
      </div>

      <button id="save-btn" class="btn btn-primary btn-block hidden" style="margin-top:1.5rem;" onclick="saveAssessmentsData()">💾 Save All Assessments Data</button>

    </div>

  </div>
</main>

<script type="module">
  import { startClock } from "./js/utils.js";
  import { getUsers, getSchools, getAssessments, saveAssessments } from "./js/db.js";

  const userName = sessionStorage.getItem("tfc_member_name");
  const userRole = sessionStorage.getItem("tfc_member_role");

  if (!userName || userRole !== 'supervisor') {
    window.location.href = "index.html";
  }
  startClock("live-clock");

  document.getElementById("welcome-name").textContent = userName;

  let currentSchools = [];
  let savedData = {};

  async function init() {
    const users = await getUsers();
    const myUser = users.find(u => u.name === userName);
    if (!myUser || !myUser.districts) return;

    const distEl = document.getElementById("dist-select");
    myUser.districts.forEach(d => distEl.innerHTML += `<option value="${d}">${d}</option>`);
  }

  window.loadSchools = async function() {
    const dist = document.getElementById("dist-select").value;
    const level = document.getElementById("level-select").value;
    const assessmentType = document.getElementById("assessment-select").value;
    const container = document.getElementById("schools-container");
    const saveBtn = document.getElementById("save-btn");

    if (!dist || !level || !assessmentType) {
      container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">Please select District, Level, and Assessment above.</div>`;
      saveBtn.classList.add("hidden");
      return;
    }

    container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">Loading schools...</div>`;
    
    const allSchools = await getSchools(dist);
    currentSchools = allSchools.filter(s => s.Level === level);
    savedData = await getAssessments(userName, `${dist}_${level}_${assessmentType}`);

    if (currentSchools.length === 0) {
      container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">No schools found in ${dist} for ${level}.</div>`;
      saveBtn.classList.add("hidden");
      return;
    }

    let html = "";
    currentSchools.forEach((s, idx) => {
      const sName = s["School Name"] || "Unknown School";
      
      const prevData = savedData[sName] || {};
      const status = prevData.status || ""; 
      const prevRemarks = prevData.remarks || "";
      
      const isReceived = status === "received";
      const isNotReceived = status === "not_received";
      const frozen = status !== "";
      const disabledAttr = frozen ? 'disabled' : '';

      html += `
        <div class="compact-row" id="row-${idx}" data-school="${sName}">
          <div class="compact-col-info">
            <strong>🏫 ${sName}</strong>
          </div>
          
          <div class="compact-col-input" style="display:flex;gap:0.5rem;align-items:center;">
            <button id="btn-rec-${idx}" class="compact-btn ${isReceived ? 'active green' : ''}" 
                    onclick="setStatus('${sName}', 'received', ${idx})" ${disabledAttr}>
              ✅ Received
            </button>
            <button id="btn-not-${idx}" class="compact-btn ${isNotReceived ? 'active red' : ''}" 
                    onclick="setStatus('${sName}', 'not_received', ${idx})" ${disabledAttr}>
              ❌ Not Received
            </button>
          </div>
          
          <div class="compact-col-input" style="flex:2;">
            <input type="text" id="rem-${idx}" class="form-control remarks-input" style="padding:0.4rem;" 
                   placeholder="Enter remarks..." value="${prevRemarks}" ${disabledAttr} />
          </div>
          
          <input type="hidden" class="status-val" id="status-${idx}" value="${status}" />
          ${frozen ? `<button class="btn btn-ghost btn-sm" onclick="resetSchoolStatus('${sName}')" style="padding:0;color:var(--danger);min-width:auto;margin-left:auto;">Reset 🔄</button>` : ''}
        </div>
      `;
    });
    
    container.innerHTML = html;
    saveBtn.classList.remove("hidden");
  };
  
  // Temporary state array to handle unsaved UI clicks
  window.setStatus = function(schoolName, status, idx) {
    const recvBtn = document.getElementById(`btn-rec-${idx}`);
    const notRecvBtn = document.getElementById(`btn-not-${idx}`);
    const statusInput = document.getElementById(`status-${idx}`);

    if (status === "received") {
      recvBtn.classList.add("active", "green");
      notRecvBtn.classList.remove("active", "red");
      statusInput.value = "received";
    } else {
      notRecvBtn.classList.add("active", "red");
      recvBtn.classList.remove("active", "green");
      statusInput.value = "not_received";
    }
  };

  window.resetSchoolStatus = function(schoolName) {
    const rows = document.querySelectorAll(".compact-row");
    let targetRow = null;
    let targetIdx = -1;
    
    // Find the row and its index
    rows.forEach((row, i) => {
        if(row.getAttribute("data-school") === schoolName) {
            targetRow = row;
            targetIdx = i; // Because our IDs btn-rec- rely on loop index
        }
    });
    
    if (!targetRow) return;

    const recvBtn = document.getElementById("btn-rec-" + targetIdx);
    const notRecvBtn = document.getElementById("btn-not-" + targetIdx);
    const statusInput = document.getElementById("status-" + targetIdx);
    
    if (recvBtn) { recvBtn.classList.remove("active", "green"); recvBtn.disabled = false; }
    if (notRecvBtn) { notRecvBtn.classList.remove("active", "red"); notRecvBtn.disabled = false; }
    if (statusInput) statusInput.value = "";
    
    const remarks = targetRow.querySelector(".remarks-input");
    if (remarks) remarks.disabled = false;
    
    const resetBtn = targetRow.querySelector('.btn-ghost');
    if (resetBtn) resetBtn.remove();
  };

  window.saveAssessmentsData = async function() {
    const dist = document.getElementById("dist-select").value;
    const level = document.getElementById("level-select").value;
    const assessmentType = document.getElementById("assessment-select").value;
    if (!dist || !level || !assessmentType) return;

    const rows = document.querySelectorAll(".compact-row");
    let newData = {};

    rows.forEach(row => {
      const sName = row.getAttribute("data-school");
      const status = row.querySelector(".status-val").value;
      const remarks = row.querySelector(".remarks-input").value.trim();

      newData[sName] = {
        status: status,
        remarks: remarks
      };
    });

    await saveAssessments(userName, `${dist}_${level}_${assessmentType}`, newData);
    alert("Assessments data saved successfully!");
    loadSchools(); // refresh UI to freeze everything permanently
  };

  window.doLogout = function() {
    sessionStorage.removeItem("tfc_member_name");
    sessionStorage.removeItem("tfc_member_role");
    window.location.href = "index.html";
  }
  startClock("live-clock");;

  init();
</script>
<script>
  window.toggleSidebar = function() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if(sidebar) sidebar.classList.toggle('active');
    if(overlay) overlay.classList.toggle('active');
  };
</script>
</body>
</html>
