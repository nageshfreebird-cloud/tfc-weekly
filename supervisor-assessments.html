<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessments Received — Teach for Change</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .school-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .school-row-header {
      font-weight: 600;
      color: var(--primary);
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }
    .school-row-content {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 800px) {
      .school-row-content { grid-template-columns: 1fr; }
    }
    .btn-toggle {
      width: 100%;
      height: 80px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-toggle:hover:not(:disabled) {
      border-color: var(--primary);
    }
    .btn-toggle.received {
      background: var(--success);
      color: white;
      border-color: var(--success);
    }
    .btn-toggle.not-received {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }
    .btn-toggle:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime">
    <span id="welcome-name" style="margin-right:1rem;font-weight:600;"></span>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
  </div>
</nav>

<div class="page">
  <div class="container-wide" style="max-width: 1200px;">

    <div class="nav-tabs" style="margin-bottom:2rem;display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;">
      <a href="supervisor.html">⚙️ Registry & Year Plan</a>
      <a href="team.html">Weekly Tasks</a>
      <a href="supervisor-calls.html">📞 15-Days Teacher Calls</a>
      <a href="supervisor-assessments.html" class="active">📝 Assessments Received</a>
      <a href="supervisor-drive.html">📁 Assessments Record in Drive</a>
      <a href="supervisor-sheets.html">🔗 Google Sheet Links</a>
    </div>

    <div class="setup-panel">
      <h2>📝 Assessments Received</h2>
      <p class="text-muted mb-3" style="margin-bottom:1.5rem;">Select your district and level to log assessment collection status.</p>

      <div style="display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;">
        <div style="flex:1;">
          <label class="form-label">District</label>
          <select id="dist-select" class="form-control" onchange="loadSchools()">
            <option value="">Select District</option>
          </select>
        </div>
        <div style="flex:1;">
          <label class="form-label">Level</label>
          <select id="level-select" class="form-control" onchange="loadSchools()">
            <option value="">Select Level</option>
            <option value="Level-1">Level-1</option>
            <option value="Level-2">Level-2</option>
            <option value="Level-3">Level-3</option>
            <option value="Level-4">Level-4</option>
          </select>
        </div>
      </div>

      <div id="schools-container" style="background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:1.5rem;min-height:300px;">
        <div class="text-muted text-center" style="margin-top:2rem;">Please select a district and level above.</div>
      </div>

      <button id="save-btn" class="btn btn-primary btn-block hidden" style="margin-top:1.5rem;" onclick="saveAssessmentsData()">💾 Save All Assessments Data</button>

    </div>

  </div>
</div>

<script type="module">
  import { getUsers, getSchools, getAssessments, saveAssessments } from "./js/db.js";

  const userName = sessionStorage.getItem("tfc_member_name");
  const userRole = sessionStorage.getItem("tfc_member_role");

  if (!userName || userRole !== 'supervisor') {
    window.location.href = "index.html";
  }

  document.getElementById("welcome-name").textContent = userName;

  let currentSchools = [];
  let savedData = {};

  async function init() {
    const users = await getUsers();
    const myUser = users.find(u => u.name === userName);
    if (!myUser || !myUser.districts) return;

    const distEl = document.getElementById("dist-select");
    myUser.districts.forEach(d => distEl.innerHTML += `<option value="${d}">${d}</option>`);
  }

  window.loadSchools = async function() {
    const dist = document.getElementById("dist-select").value;
    const level = document.getElementById("level-select").value;
    const container = document.getElementById("schools-container");
    const saveBtn = document.getElementById("save-btn");

    if (!dist || !level) {
      container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">Please select a district and level above.</div>`;
      saveBtn.classList.add("hidden");
      return;
    }

    container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">Loading schools...</div>`;
    
    const allSchools = await getSchools(dist);
    currentSchools = allSchools.filter(s => s.Level === level);
    savedData = await getAssessments(userName, `${dist}_${level}`);

    if (currentSchools.length === 0) {
      container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">No schools found in ${dist} for ${level}.</div>`;
      saveBtn.classList.add("hidden");
      return;
    }

    let html = "";
    currentSchools.forEach((s, idx) => {
      const sName = s["School Name"] || "Unknown School";
      
      const prevData = savedData[sName] || {};
      const status = prevData.status || ""; 
      const prevRemarks = prevData.remarks || "";
      
      // Freeze buttons if status is already set
      const isReceived = status === "received";
      const isNotReceived = status === "not_received";
      const frozen = status !== "";

      html += `
        <div class="school-row" data-school="${sName}">
          <div class="school-row-header">
            <span>🏫 ${sName}</span>
            ${frozen ? `<button class="btn btn-ghost btn-sm" onclick="resetSchoolStatus('${sName}')" style="padding:0;color:var(--danger);">Reset ↺</button>` : ''}
          </div>
          <div class="school-row-content">
            <div>
              <button id="btn-recv-${idx}" class="btn-toggle ${isReceived ? 'received' : ''}" ${frozen ? 'disabled' : ''} onclick="setStatus('${sName}', 'received', ${idx})">Option 1:<br/>✅ Received</button>
            </div>
            <div>
              <button id="btn-notrecv-${idx}" class="btn-toggle ${isNotReceived ? 'not-received' : ''}" ${frozen ? 'disabled' : ''} onclick="setStatus('${sName}', 'not_received', ${idx})">Option 2:<br/>❌ Not Received</button>
            </div>
            <div>
              <label class="form-label text-sm">Option 3: Remarks</label>
              <textarea class="form-control remarks-input" style="height:80px;resize:none;" placeholder="Enter remarks...">${prevRemarks}</textarea>
            </div>
          </div>
          <input type="hidden" class="status-val" value="${status}" />
        </div>
      `;
    });

    container.innerHTML = html;
    saveBtn.classList.remove("hidden");
  };
  
  // Temporary state array to handle unsaved UI clicks
  window.setStatus = function(schoolName, status, idx) {
    const row = document.querySelector(`.school-row[data-school="${schoolName}"]`);
    const recvBtn = document.getElementById(`btn-recv-${idx}`);
    const notRecvBtn = document.getElementById(`btn-notrecv-${idx}`);
    const statusInput = row.querySelector(".status-val");

    if (status === "received") {
      recvBtn.classList.add("received");
      notRecvBtn.classList.remove("not-received");
      statusInput.value = "received";
    } else {
      notRecvBtn.classList.add("not-received");
      recvBtn.classList.remove("received");
      statusInput.value = "not_received";
    }
    
    // Freeze them visually
    recvBtn.disabled = true;
    notRecvBtn.disabled = true;
    
    // Show a reset button just in case they made a mistake before saving
    row.querySelector(".school-row-header").innerHTML = `
      <span>🏫 ${schoolName}</span>
      <button class="btn btn-ghost btn-sm" onclick="resetSchoolStatus('${schoolName}', ${idx})" style="padding:0;color:var(--danger);">Reset ↺</button>
    `;
  };

  window.resetSchoolStatus = function(schoolName, idx) {
    if (idx === undefined) {
      // Re-render entirely if it was loaded frozen
      loadSchools();
      return;
    }
    const row = document.querySelector(`.school-row[data-school="${schoolName}"]`);
    const recvBtn = document.getElementById(`btn-recv-${idx}`);
    const notRecvBtn = document.getElementById(`btn-notrecv-${idx}`);
    const statusInput = row.querySelector(".status-val");
    
    recvBtn.classList.remove("received");
    notRecvBtn.classList.remove("not-received");
    recvBtn.disabled = false;
    notRecvBtn.disabled = false;
    statusInput.value = "";
    
    row.querySelector(".school-row-header").innerHTML = `<span>🏫 ${schoolName}</span>`;
  };

  window.saveAssessmentsData = async function() {
    const dist = document.getElementById("dist-select").value;
    const level = document.getElementById("level-select").value;
    if (!dist || !level) return;

    const rows = document.querySelectorAll(".school-row");
    let newData = {};

    rows.forEach(row => {
      const sName = row.getAttribute("data-school");
      const status = row.querySelector(".status-val").value;
      const remarks = row.querySelector(".remarks-input").value.trim();

      newData[sName] = {
        status: status,
        remarks: remarks
      };
    });

    await saveAssessments(userName, `${dist}_${level}`, newData);
    alert("Assessments data saved successfully!");
    loadSchools(); // refresh UI to freeze everything permanently
  };

  window.doLogout = function() {
    sessionStorage.removeItem("tfc_member_name");
    sessionStorage.removeItem("tfc_member_role");
    window.location.href = "index.html";
  };

  init();
</script>
</body>
</html>
