<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Login — Teach for Change</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    window.togglePassword = function(id) {
      const input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
      } else {
        input.type = "password";
      }
    };
  </script>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" width="72" height="36" loading="lazy" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime">
    <span class="time-icon">🕐</span>
    <span id="live-clock">Loading...</span>
  </div>
</nav>

<main class="page" style="display:flex;align-items:center;min-height:calc(100vh - 60px);">
  <div class="container" style="width:100%;">

    <div style="text-align:center;margin-bottom:1.75rem;">
      <div style="font-size:3rem;margin-bottom:0.5rem;">🔐</div>
      <h1 style="font-size:1.5rem;font-weight:800;color:var(--primary);margin-bottom:0.3rem;">Manager Login</h1>
      <p style="color:var(--text-muted);font-size:0.9rem;">Teach for Change — Weekly Review System</p>
    </div>

    <div class="card" style="max-width:400px;margin:0 auto;">

      <div id="error-msg" class="alert alert-danger hidden">
        <span>❌</span><span id="error-text">Invalid User ID or Password.</span>
      </div>

      <button type="button" id="login-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:1rem; display:flex; align-items:center; justify-content:center; gap:0.5rem;" onclick="doGoogleLogin()">
          <svg style="width:20px;height:20px;" viewBox="0 0 24 24">
            <path fill="currentColor" d="M21.35,11.1H12.18V13.83H18.69C18.36,17.64 15.19,19.27 12.19,19.27C8.36,19.27 5,16.25 5,12C5,7.9 8.2,4.73 12.2,4.73C15.29,4.73 17.1,6.7 17.1,6.7L19,4.72C19,4.72 16.56,2 12.1,2C6.42,2 2.03,6.8 2.03,12C2.03,17.05 6.16,22 12.25,22C17.6,22 21.5,18.33 21.5,12.91C21.5,11.76 21.35,11.1 21.35,11.1V11.1Z" />
          </svg>
          Sign in with Google
        </button>
        <div id="error-msg" class="alert alert-danger hidden" style="margin-top:1rem;text-align:left;">
          ⚠️ <span id="error-text">Unauthorized Email.</span>
        </div>

      <div style="text-align:center;margin-top:1rem;">
        <a href="index.html" style="font-size:0.85rem;color:var(--text-muted);">← Back to Home</a>
      </div>
    </div>

  </div>
</main>

<script type="module">
  import { startClock } from "./js/utils.js";
  import { signInManagerWithGoogle } from "./js/auth.js";

  startClock("live-clock");

  

  window.doGoogleLogin = async function() {
    const btn      = document.getElementById("login-btn");
    const errEl    = document.getElementById("error-msg");
    const errText  = document.getElementById("error-text");
    
    const origBtnText = btn.innerHTML;
    btn.textContent = "Verifying...";
    btn.disabled = true;
    errEl.classList.add("hidden");

    try {
      await signInManagerWithGoogle();
      window.location.href = "dashboard.html";
    } catch(err) {
      if (err.message === "UNAUTHORIZED_EMAIL") {
        errText.textContent = "Your email is not authorized for manager access.";
      } else {
        errText.textContent = "Login failed. Please try again.";
      }
      errEl.classList.remove("hidden");
      btn.innerHTML = origBtnText;
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
