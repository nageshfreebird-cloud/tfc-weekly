<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Login — Teach for Change</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime">
    <span class="time-icon">🕐</span>
    <span id="live-clock">Loading...</span>
  </div>
</nav>

<div class="page" style="display:flex;align-items:center;min-height:calc(100vh - 60px);">
  <div class="container" style="width:100%;">

    <div style="text-align:center;margin-bottom:1.75rem;">
      <div style="font-size:3rem;margin-bottom:0.5rem;">🔐</div>
      <h1 style="font-size:1.5rem;font-weight:800;color:var(--primary);margin-bottom:0.3rem;">Manager Login</h1>
      <p style="color:var(--text-muted);font-size:0.9rem;">Teach for Change — Weekly Review System</p>
    </div>

    <div class="card" style="max-width:400px;margin:0 auto;">

      <div id="error-msg" class="alert alert-danger hidden">
        <span>❌</span><span id="error-text">Invalid User ID or Password.</span>
      </div>

      <form id="login-form" onsubmit="doLogin(event)">
        <div class="form-group">
          <label class="form-label" for="user-id">User ID</label>
          <input type="text" class="form-control" id="user-id"
            placeholder="Enter your User ID" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position:relative;">
            <input type="password" class="form-control" id="password"
              placeholder="Enter password" autocomplete="current-password" required
              style="padding-right:3rem;" />
            <button type="button" onclick="togglePwd()" title="Show/Hide"
              style="position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);background:none;border:none;font-size:1.1rem;color:var(--text-muted);cursor:pointer;">
              👁️
            </button>
          </div>
        </div>

        <div class="alert alert-info" style="margin-bottom:1.5rem;text-align:left;">
          ℹ️ Enter your manager credentials to access the dashboard.
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:1rem;">
          Login →
        </button>
      </form>

      <div style="text-align:center;margin-top:1rem;">
        <a href="index.html" style="font-size:0.85rem;color:var(--text-muted);">← Back to Home</a>
      </div>
    </div>

  </div>
</div>

<script type="module">
  import { startClock, setManagerSession } from "./js/utils.js";
  import { verifyAdminLogin } from "./js/db.js";

  startClock("live-clock");

  window.togglePwd = function() {
    const inp = document.getElementById("password");
    inp.type = inp.type === "password" ? "text" : "password";
  };

  window.doLogin = async function(e) {
    e.preventDefault();
    const userId   = document.getElementById("user-id").value.trim();
    const password = document.getElementById("password").value;
    const btn      = document.getElementById("login-btn");
    const errEl    = document.getElementById("error-msg");

    btn.textContent = "Verifying...";
    btn.disabled = true;
    errEl.classList.add("hidden");

    try {
      const ok = await verifyAdminLogin(userId, password);
      if (ok) {
        setManagerSession();
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("error-text").textContent = "Invalid User ID or Password.";
        errEl.classList.remove("hidden");
        btn.textContent = "Login →";
        btn.disabled = false;
      }
    } catch(err) {
      document.getElementById("error-text").textContent = "Connection error. Check Firebase setup.";
      errEl.classList.remove("hidden");
      btn.textContent = "Login →";
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
