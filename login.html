<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Login — Teach for Change</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.min.css" />
  <script>
    window.togglePassword = function(id) {
      const input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
      } else {
        input.type = "password";
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/ui.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logo.webp">
  <link rel="icon" type="image/png" href="logo.webp">
  <meta property="og:title" content="Teach for Change - Weekly Review System">
  <meta property="og:description" content="Team Attendance, Assessments & Weekly Tasks">
  <meta property="og:image" content="logo.webp">
  <meta property="og:type" content="website">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <img src="logo.webp" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" width="72" height="36" loading="lazy" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime">
    <span class="time-icon">🕐</span>
    <span id="live-clock">Loading...</span>
  </div>
</nav>

<style>
  .login-wrapper {
    display: flex;
    min-height: calc(100vh - 60px);
    background: #f8fafc;
  }
  .login-left {
    flex: 1;
    background: linear-gradient(135deg, var(--primary), #1e293b);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 3rem;
  }
  .login-left h1 {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 1rem;
    line-height: 1.2;
  }
  .login-left p {
    font-size: 1.1rem;
    opacity: 0.9;
    line-height: 1.6;
    max-width: 400px;
  }
  .login-right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .login-card {
    background: white;
    padding: 2.5rem;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--border);
  }
  @media (max-width: 768px) {
    .login-wrapper { flex-direction: column; }
    .login-left { padding: 2rem; text-align: center; align-items: center; }
    .login-left h1 { font-size: 2rem; }
  }
</style>

<main class="login-wrapper">
  <div class="login-left">
    <img src="logo.webp" alt="Teach for Change" style="height:140px; width:auto; object-fit:contain; margin-bottom:2rem; background: rgba(255,255,255,0.1); padding: 1rem; border-radius: 16px;" />
    <h1>Empowering<br/>Education</h1>
    <p>Welcome to the Teach for Change Weekly Review System. Manage your teams, track attendance, and monitor student progress seamlessly.</p>
  </div>

  <div class="login-right">
    <div class="login-card">
      <div style="text-align:center; margin-bottom:2rem;">
        <div style="font-size:3rem; margin-bottom:0.5rem;">🔐</div>
        <h2 style="font-size:1.5rem; font-weight:800; color:#1e293b; margin-bottom:0.3rem; margin-top:0;">Manager Login</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin:0;">Secure portal access</p>
      </div>

      <div id="error-msg" class="alert alert-danger hidden" style="margin-bottom:1rem;">
        <span>❌</span><span id="error-text">Invalid User ID or Password.</span>
      </div>

      <button type="button" id="login-btn" class="btn btn-primary btn-block btn-lg" style="margin-top:1rem; display:flex; align-items:center; justify-content:center; gap:0.5rem;" onclick="doGoogleLogin()" disabled>
        <svg style="width:20px;height:20px;" viewBox="0 0 24 24">
          <path fill="currentColor" d="M21.35,11.1H12.18V13.83H18.69C18.36,17.64 15.19,19.27 12.19,19.27C8.36,19.27 5,16.25 5,12C5,7.9 8.2,4.73 12.2,4.73C15.29,4.73 17.1,6.7 17.1,6.7L19,4.72C19,4.72 16.56,2 12.1,2C6.42,2 2.03,6.8 2.03,12C2.03,17.05 6.16,22 12.25,22C17.6,22 21.5,18.33 21.5,12.91C21.5,11.76 21.35,11.1 21.35,11.1V11.1Z" />
        </svg>
        Sign in with Google
      </button>

      <div style="text-align:center; margin-top:1.5rem;">
        <a href="index.html" style="font-size:0.9rem; color:var(--text-muted); text-decoration:none; font-weight:500;">← Back to Home</a>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { startClock } from "./js/utils.min.js";
  import { signInManagerWithGoogle, ALLOWED_MANAGERS, auth } from "./js/auth.min.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
onAuthStateChanged(auth, async (user) => {
    if (user) {
        if (ALLOWED_MANAGERS.includes(user.email.toLowerCase())) {
            const btn = document.getElementById("login-btn");
            if(btn) btn.innerHTML = "Redirecting...";
            window.location.href = "dashboard.html?v=clearCache2";
        } else {
            await signOut(auth);
            const btn = document.getElementById("login-btn");
            if(btn) btn.disabled = false;
            const errEl = document.getElementById("error-msg");
            const errText = document.getElementById("error-text");
            if (errEl && errText) {
                errText.textContent = "Your email is not authorized for manager access.";
                errEl.classList.remove("hidden");
            }
        }
    } else {
        const btn = document.getElementById("login-btn");
        if(btn) btn.disabled = false;
    }
});

  startClock("live-clock");

  

  window.doGoogleLogin = async function() {
    const btn      = document.getElementById("login-btn");
    const errEl    = document.getElementById("error-msg");
    const errText  = document.getElementById("error-text");
    
    const origBtnText = btn.innerHTML;
    btn.textContent = "Verifying...";
    btn.disabled = true;
    errEl.classList.add("hidden");

    try {
      await signInManagerWithGoogle();
      window.location.href = "dashboard.html?v=clearCache2";
    } catch(err) {
      if (err.message === "UNAUTHORIZED_EMAIL") {
        errText.textContent = "Your email is not authorized for manager access.";
      } else {
        errText.textContent = "Login failed. Please try again.";
      }
      errEl.classList.remove("hidden");
      btn.innerHTML = origBtnText;
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
