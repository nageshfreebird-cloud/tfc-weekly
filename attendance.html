<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Attendance - Teach for Change</title>
  <link rel="stylesheet" href="css/style.min.css" />
  <style>
    body { background: #f8fafc; font-family: 'Inter', sans-serif; }
    .att-container { max-width: 600px; margin: 0 auto; padding: 1rem; }
    .header { background: var(--primary); color: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: center; }
    .search-box { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1rem; font-size: 1rem; box-sizing: border-box; }
    .user-card { background: white; padding: 0.85rem 1rem; border-radius: 10px; margin-bottom: 0.65rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: 600; color: #1e293b; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 0.8rem; color: #64748b; margin-top: 1px; }
    .btn-group { display: flex; gap: 0.4rem; flex-shrink: 0; align-items: center; }
    .btn-in, .btn-out { background: white; color: #475569; border: 1.5px solid #cbd5e1; padding: 0.45rem 0.9rem; border-radius: 6px; font-weight: 700; font-size: 0.85rem; transition: all 0.2s; cursor: pointer; }
    .btn-in.active { background: #10b981; color: white; border-color: #10b981; }
    .btn-out.active { background: #ef4444; color: white; border-color: #ef4444; }

    /* Avatar Circle */
    .avatar-circle { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; flex-shrink: 0; letter-spacing: 0.5px; }

    /* Status Badge */
    .status-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-top: 3px; }
    .status-pending  { background: #fef9c3; color: #854d0e; }
    .status-in-only  { background: #ffedd5; color: #c2410c; }
    .status-complete { background: #e0f2fe; color: #0369a1; }

    /* Circular Camera Modal */
    .camera-wrapper { position: relative; width: 260px; height: 260px; border-radius: 50%; overflow: hidden; background: #000; margin: 0 auto; border: 4px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
    .camera-wrapper video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .camera-wrapper canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    .camera-msg-bar { text-align: center; margin-top: 0.75rem; font-weight: 600; font-size: 0.9rem; color: #1e293b; min-height: 1.4em; }

    .loading-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/ui.min.js"></script>
  <script src="js/face-api.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logo.webp">
  <link rel="icon" type="image/png" href="logo.webp">
  <meta property="og:title" content="Teach for Change - Weekly Review System">
  <meta property="og:description" content="Team Attendance, Assessments & Weekly Tasks">
  <meta property="og:image" content="logo.webp">
  <meta property="og:type" content="website">
</head>
<body>

<div id="mobile-error" style="display:none; text-align:center; padding:3rem 1rem;">
  <div style="font-size:4rem; margin-bottom:1rem;">&#128241;</div>
  <h2 style="color:var(--danger);">Mobile Only Feature</h2>
  <p style="color:var(--text-muted); font-size:1.1rem;">Attendance can only be logged from a Mobile Phone.</p>
</div>

<div id="app-content" class="att-container" style="display:none;">
      <div class="header">
      <div style="display: flex; align-items: center; gap: 15px;">
        <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'" style="background: rgba(255,255,255,0.2); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">&#8592;</button>
        <h2 style="margin:0; font-size:1.5rem;">&#128205; Live Attendance</h2>
      </div>
      <p style="margin:0.5rem 0 0 0; opacity:0.9;">Select your name and punch your location.</p>
      
    </div>
  
  <input type="text" id="search-input" class="search-box" placeholder="Search your name..." oninput="filterUsers()" />
  
  <div id="users-list"></div>
</div>

<div id="loading" class="loading-overlay">
  <div class="spinner"></div>
  <h3 style="color:var(--primary); margin:0;" id="loading-msg">Fetching GPS Location...</h3>
  <p style="color:#64748b; font-size:0.9rem;">Please allow location access if prompted.</p>
</div>

<script type="module">
  import { getUsers, logTeamAttendance, checkMissingOutPunch, acknowledgeMissingPunch, updateUserBaseLocation, getTodayTeamAttendance, getHolidays, requestLeave, saveUserBiometrics } from "./js/db.min.js?v=4";

  let allUsers = [];
  let attMap = {};

  function checkMobile() {
    const isMobileStr = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const isSmallScreen = window.innerWidth <= 1024;
    const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    
    // Some phones in "Desktop Mode" fake the user agent and screen width. Touch support is the most reliable fallback.
    if (!isMobileStr && !isSmallScreen && !hasTouch) {
      document.getElementById("mobile-error").style.display = "block";
      return false;
    }
    document.getElementById("app-content").style.display = "block";
    return true;
  }

  async function init() {
    if (!checkMobile()) return;
    
    try {
      const todayStr = new Date().toISOString().split('T')[0];
              const [holidays, todayLogs, users] = await Promise.all([
          getHolidays(),
          getTodayTeamAttendance(),
          getUsers()
        ]);
        
        if (holidays.includes(todayStr)) {
            document.getElementById("app-content").innerHTML = `
              <div style="padding:2rem; text-align:center; margin-top:30%;">
                  <h2 style="color:#dc2626;">🚫 Not Allowed</h2>
                  <p>Today is marked as a Holiday or Weekend. Attendance is blocked.</p>
              </div>
            `;
            return;
        }
        
        todayLogs.forEach(a => {
            attMap[a.name] = { inTime: a.inTime, outTime: a.outTime };
        });
      allUsers = users.filter(u => u.role !== 'manager').sort((a,b) => a.name.localeCompare(b.name));
      renderUsers(allUsers);
    } catch(err) {
      showToast("Error loading users: " + err.message);
    }
  }

  function renderUsers(list) {
    const container = document.getElementById("users-list");
    container.innerHTML = "";

    list.forEach(u => {
      const card = document.createElement("div");
      card.className = "user-card";

      let roleDisplay = "Team Member";
      if (u.role === 'supervisor') roleDisplay = "Supervisor";
      else if (u.role === 'associate-sc') roleDisplay = "SC Associate";
      else if (u.role === 'associate-vol') roleDisplay = "Vol Associate";

      const att = attMap[u.name] || {};
      const inActive = att.inTime ? "active" : "";
      const outActive = att.outTime ? "active" : "";
      const cleanName = u.name.replace(/[^a-zA-Z0-9]/g, '_');

      const isRegistered = !!u.faceDescriptor;
      const regBtnText = isRegistered ? "✅ Re-Register" : "📸 Register Face";
      const regBtnStyle = isRegistered
        ? "background:transparent; color:var(--text-muted); font-size:0.7rem; border:1px solid var(--border); padding:1px 5px; border-radius:4px; cursor:pointer;"
        : "background:#fef3c7; color:#92400e; font-size:0.7rem; border:1px solid #fcd34d; padding:1px 5px; border-radius:4px; cursor:pointer;";

      // Avatar initials — first letter of first and last name
      const parts = u.name.trim().split(' ');
      const initials = parts.length >= 2
        ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
        : u.name.substring(0, 2).toUpperCase();

      // Avatar gradient based on first letter (gives each person a distinct colour)
      const gradients = [
        'linear-gradient(135deg,#667eea,#764ba2)',
        'linear-gradient(135deg,#f093fb,#f5576c)',
        'linear-gradient(135deg,#4facfe,#00f2fe)',
        'linear-gradient(135deg,#43e97b,#38f9d7)',
        'linear-gradient(135deg,#fa709a,#fee140)',
        'linear-gradient(135deg,#a18cd1,#fbc2eb)',
        'linear-gradient(135deg,#ffecd2,#fcb69f)',
        'linear-gradient(135deg,#a1c4fd,#c2e9fb)',
      ];
      const gradIdx = u.name.charCodeAt(0) % gradients.length;

      // Status badge
      let statusBadge = '';
      if (att.inTime && att.outTime) {
        statusBadge = `<span class="status-badge status-complete">✅ Complete</span>`;
      } else if (att.inTime && !att.outTime) {
        statusBadge = `<span class="status-badge status-in-only">🟢 IN — Pending OUT</span>`;
      } else {
        statusBadge = `<span class="status-badge status-pending">⏳ Pending</span>`;
      }

      card.innerHTML = `
        <div class="avatar-circle" style="background:${gradients[gradIdx]};">${initials}</div>
        <div class="user-info">
          <div class="user-name">${u.name}</div>
          <div class="user-role">${roleDisplay} &nbsp;|&nbsp; ${statusBadge}</div>
          <button onclick="window.registerFace('${u.name}')" style="${regBtnStyle} margin-top:3px;">${regBtnText}</button>
        </div>
        <div class="btn-group">
          <button id="btn-in-${cleanName}" class="btn-in ${inActive}" onclick="window.punchAttendance('${u.name}', 'IN')">IN</button>
          <button id="btn-out-${cleanName}" class="btn-out ${outActive}" onclick="window.punchAttendance('${u.name}', 'OUT')">OUT</button>
        </div>
      `;
      container.appendChild(card);
    });
  }


  window.filterUsers = function() {
    const q = document.getElementById("search-input").value.toLowerCase();
    const filtered = allUsers.filter(u => u.name.toLowerCase().includes(q));
    renderUsers(filtered);
  }

  function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
    var R = 6371000; // Radius of the earth in m
    var dLat = (lat2-lat1) * (Math.PI/180);
    var dLon = (lon2-lon1) * (Math.PI/180); 
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * 
            Math.sin(dLon/2) * Math.sin(dLon/2); 
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
    return R * c; // Distance in m
    }

    window.oldPunchAttendance = async function(name, type, skipConfirm = false) {
    try {
      if (!navigator.geolocation) {
        Swal.fire("Error", "Geolocation is not supported by your browser.", "error");
        return;
      }
      
      // Find user's base location
      const user = allUsers.find(u => u.name === name);
      if(!user) return;
      
      // Block Double Punch IN and OUT
      if (type === 'IN' && attMap[name] && attMap[name].inTime) {
          Swal.fire("Already Punched", "You have already punched IN today!", "error");
          return;
      }
      if (type === 'OUT' && attMap[name] && attMap[name].outTime) {
          Swal.fire("Already Punched", "You have already punched OUT today!", "error");
          return;
      }

              // Missing punch check for IN
      if (type === 'IN') {
          const missing = await checkMissingOutPunch(name);
          if (missing) {
              await Swal.fire("Missing Punch!", `⚠️ You forgot to punch OUT on ${missing.date}. Please inform your manager to correct your timesheet.`, "warning");
              await acknowledgeMissingPunch(missing.id);
          }
      }
    
    if (!skipConfirm) {
        const result = await Swal.fire({
          title: `Punch ${type} for ${name}?`,
          showCancelButton: true,
          confirmButtonText: 'Yes, Punch ' + type
        });
        if(!result.isConfirmed) return;
    }

    const loader = document.getElementById("loading");
    loader.style.display = "flex";

    navigator.geolocation.getCurrentPosition(async (position) => {
      try {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        let reason = null;
        
        // Geofencing Check
        if (user.baseLat && user.baseLng) {
            const dist = getDistanceFromLatLonInM(lat, lng, user.baseLat, user.baseLng);
            if (dist > 200) {
                loader.style.display = "none";
                const { value: reasonText, isDismissed, isDenied } = await Swal.fire({
                    title: 'Out of Range',
                    text: `You are ${Math.round(dist)} meters away from your assigned base location. Please enter a reason (e.g., Field Work).`,
                    input: 'text',
                    inputPlaceholder: 'Enter reason here...',
                    showCancelButton: true,
                    showDenyButton: true,
                    confirmButtonText: 'Submit Reason',
                    denyButtonText: 'Retry Location',
                    denyButtonColor: '#3b82f6',
                    cancelButtonText: 'Cancel',
                    inputValidator: (value) => {
                        if (!value) return 'You need to write a reason to check in!'
                    }
                });
                
                if (isDenied) {
                    loader.style.display = "flex";
                    return window.oldPunchAttendance(name, type, true);
                }
                if (isDismissed || !reasonText) return; // Cancelled punch
                reason = reasonText;
                loader.style.display = "flex";
            }
        } else {
            // No base location assigned yet!
            loader.style.display = "none";
            const setBasePrompt = await Swal.fire({
                title: 'Set Base Location?',
                text: 'Is your current location your permanent Base Location?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, set as Base',
                cancelButtonText: 'No, just log attendance'
            });
            loader.style.display = "flex";
            
            if (setBasePrompt.isConfirmed) {
                await updateUserBaseLocation(name, lat, lng);
                user.baseLat = lat; // update local state
                user.baseLng = lng;
            }
        }
        
        await logTeamAttendance(name, type, lat, lng, reason);
        
        loader.style.display = "none";
        Swal.fire("Success", `Successfully punched ${type}!\nTime and Location logged.`, "success");
        
        // Update DOM instantly
        const cleanName = name.replace(/[^a-zA-Z0-9]/g, '_');
        const btnId = type === 'IN' ? `btn-in-${cleanName}` : `btn-out-${cleanName}`;
        const btn = document.getElementById(btnId);
        if (btn) btn.classList.add("active");
        
        // Update local state map so search/filter preserves it
        if(!attMap[name]) attMap[name] = {};
        if (type === 'IN') attMap[name].inTime = true;
        if (type === 'OUT') attMap[name].outTime = true;
        
        window.renderTeam();
      } catch (err) {
        loader.style.display = "none";
        Swal.fire("Error", "Error logging attendance: " + err.message, "error");
      }
    }, (err) => {
      loader.style.display = "none";
      Swal.fire("Location Error", "Please enable GPS/Location to check in.", "error");
    }, { enableHighAccuracy: true });
    } catch(err) { Swal.fire('Error', err.message, 'error'); }
  }

  init();
  // Silently preload AI models in background so camera opens instantly
  setTimeout(() => { loadModels(true).catch(()=>{}); }, 1000);

  
  let modelsLoaded = false;
  function showLoading(msg) {
      if (typeof Swal !== "undefined") Swal.fire({title: msg, allowOutsideClick: false, didOpen: () => Swal.showLoading()});
    }

    async function loadModels(silent = false) {
    if(modelsLoaded) return;
    try {
      if (!silent) showLoading("Loading AI Models...");
      await faceapi.nets.tinyFaceDetector.loadFromUri('./models');
      await faceapi.nets.faceLandmark68Net.loadFromUri('./models');
      await faceapi.nets.faceRecognitionNet.loadFromUri('./models');
      
      // Warm up the neural network with a blank canvas to prevent the video feed from freezing on first scan
      try {
        const warmupCanvas = document.createElement('canvas');
        warmupCanvas.width = 224; warmupCanvas.height = 224;
        await faceapi.detectAllFaces(warmupCanvas, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.1, inputSize: 224 })).withFaceLandmarks().withFaceDescriptors();
      } catch(e) { console.warn("Warmup skipped", e); }
      
      modelsLoaded = true;
      if (!silent && typeof Swal !== 'undefined') Swal.close();
    } catch(e) {
      console.error(e);
      if (!silent && typeof Swal !== 'undefined') Swal.fire("Error", "Could not load AI models: " + e.message, "error");
    }
  }

  let stream = null;
  let detectInterval = null;
  
  async function startCamera() {
      try {
    await loadModels();
    const video = document.getElementById('webcam');
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    return new Promise(resolve => {
        video.onloadedmetadata = () => {
            video.play();
            resolve();
        };
    });
      } catch(err) {
        if (window.closeCamera) window.closeCamera();
        throw err;
      }
  }
  
  window.closeCamera = function() {
    if(stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    if(detectInterval) {
      clearInterval(detectInterval);
      detectInterval = null;
    }
    if(window.removeScanLine) window.removeScanLine();
    document.getElementById('camera-modal').close();
  }
  
  function dist2D(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  function calculateEAR(eye) {
    const v1 = dist2D(eye[1], eye[5]);
    const v2 = dist2D(eye[2], eye[4]);
    const h = dist2D(eye[0], eye[3]);
    return (v1 + v2) / (2.0 * h);
  }

  window.registerFace = async function(name) {
    document.getElementById('camera-modal').showModal();
    if(window.addScanLine) window.addScanLine();
    document.getElementById('btn-pin-fallback').style.display = 'none';
    document.getElementById('camera-msg').innerText = "Look straight at the camera...";
    
    await startCamera();
    
    const video = document.getElementById('webcam');
    const overlay = document.getElementById('overlay');
    const displaySize = { width: video.videoWidth, height: video.videoHeight };
    faceapi.matchDimensions(overlay, displaySize);
    
    detectInterval = setInterval(async () => {
       // Focus Mode: Detect all faces, pick the largest one, ignore small background faces
             const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.6, inputSize: 224 })).withFaceLandmarks().withFaceDescriptors();
             let detection = null;
             if (detections && detections.length > 0) {
                 // Sort by face size (area)
                 detections.sort((a, b) => (b.detection.box.width * b.detection.box.height) - (a.detection.box.width * a.detection.box.height));
                 const largestFace = detections[0];
                 
                 // Face must be large enough (close to camera) to be accepted
                 if (largestFace.detection.box.width > 90) {
                     detection = largestFace;
                 } else {
                     document.getElementById('camera-msg').innerText = "Move closer to the camera...";
                 }
             }
       if (detection) {
           clearInterval(detectInterval);
           document.getElementById('camera-msg').innerText = "Face captured!";
           const dims = faceapi.matchDimensions(overlay, displaySize);
           faceapi.draw.drawDetections(overlay, faceapi.resizeResults(detection, dims));
           
           setTimeout(async () => {
               window.closeCamera();
               const { value: pin } = await Swal.fire({
                  title: 'Create 4-Digit PIN',
                  text: 'Enter a backup PIN if the camera ever fails.',
                  input: 'text',
                  inputAttributes: { pattern: "\\d{4}", maxlength: 4 },
                  showCancelButton: true
               });
               
               if(pin && pin.length === 4) {
                   showLoading("Saving profile...");
                   const descriptorArray = Array.from(detection.descriptor);
                   await saveUserBiometrics(name, descriptorArray, pin);
                   Swal.fire("Success", "Face and PIN registered!", "success");
                    // Update local user data so button shows Re-Register immediately
                    const regUser = allUsers.find(u => u.name === name);
                    if (regUser) { regUser.faceDescriptor = Array.from(detection.descriptor); regUser.pin = pin; }
                    renderUsers(allUsers);
               } else {
                   showToast("Registration cancelled or invalid PIN.");
               }
           }, 1000);
       }
    }, 200);
  };

  async function promptPin(user, type) {
      const { value: pin } = await Swal.fire({
          title: 'Enter Backup PIN',
          input: 'text',
          inputAttributes: { maxlength: 4 },
          showCancelButton: true
      });
      if(pin === user.pin) {
          window.oldPunchAttendance(user.name, type);
      } else if (pin) {
          Swal.fire("Error", "Incorrect PIN", "error");
      }
  }

  window.punchAttendance = async function(name, type) {
     const users = await getUsers();
     const user = users.find(u => u.name === name);
     if(!user.faceDescriptor || !user.pin) {
         return Swal.fire("Not Registered", "Please click 'Register Face' first.", "warning");
     }
     
     // Double Punch Block
     if (type === 'IN' && attMap[name] && attMap[name].inTime) {
         Swal.fire("Already Punched", "You have already punched IN today!", "error");
         return;
     }
     if (type === 'OUT' && attMap[name] && attMap[name].outTime) {
         Swal.fire("Already Punched", "You have already punched OUT today!", "error");
         return;
     }
     
     document.getElementById('camera-modal').showModal();
     if(window.addScanLine) window.addScanLine();
     document.getElementById('btn-pin-fallback').style.display = 'block';
     document.getElementById('btn-pin-fallback').onclick = () => { window.closeCamera(); promptPin(user, type); };
     document.getElementById('camera-msg').innerText = "Look directly at camera...";
     
     await startCamera();
     
     const video = document.getElementById('webcam');
     const overlay = document.getElementById('overlay');
     const displaySize = { width: video.videoWidth, height: video.videoHeight };
     faceapi.matchDimensions(overlay, displaySize);
     
     const savedDescriptor = new Float32Array(user.faceDescriptor);
     const faceMatcher = new faceapi.FaceMatcher(new faceapi.LabeledFaceDescriptors(name, [savedDescriptor]), 0.55);
     
     let attempts = 0;
            detectInterval = setInterval(async () => {
          attempts++;
          if(attempts > 50) {  // 10 seconds max
              clearInterval(detectInterval);
              document.getElementById('camera-msg').innerText = "Face not matched in time. Use PIN.";
              return;
          }
          
          // Focus Mode: Detect all faces, pick the largest one, ignore small background faces
             const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.6, inputSize: 224 })).withFaceLandmarks().withFaceDescriptors();
             let detection = null;
             if (detections && detections.length > 0) {
                 // Sort by face size (area)
                 detections.sort((a, b) => (b.detection.box.width * b.detection.box.height) - (a.detection.box.width * a.detection.box.height));
                 const largestFace = detections[0];
                 
                 // Face must be large enough (close to camera) to be accepted
                 if (largestFace.detection.box.width > 90) {
                     detection = largestFace;
                 } else {
                     document.getElementById('camera-msg').innerText = "Move closer to the camera...";
                 }
             }
          
          if (detection) {
              const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
              if(bestMatch.label === name) {
                  clearInterval(detectInterval);
                  document.getElementById('camera-msg').innerHTML = "Face Matched! <br> Verified!";
                  const dims = faceapi.matchDimensions(overlay, displaySize);
                  faceapi.draw.drawDetections(overlay, faceapi.resizeResults(detection, dims));
                  
                  setTimeout(() => {
                      window.closeCamera();
                      window.oldPunchAttendance(name, type);
                  }, 600);
              } else {
                   document.getElementById('camera-msg').innerText = "Face mismatch.";
              }
          } else if (!detections || detections.length === 0) { document.getElementById('camera-msg').innerText = "Look directly at camera..."; }
       }, 200);
  };
</script>

<dialog id="camera-modal" style="border:none; border-radius:20px; padding:1.5rem 1.5rem 1.25rem; max-width:92%; width:340px; box-shadow:0 12px 32px rgba(0,0,0,0.22); background:var(--card);">
  <h3 style="margin-top:0; color:var(--primary); text-align:center; font-size:1.1rem;">🔍 Face Verification</h3>
  <div class="camera-wrapper">
    <video id="webcam" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="camera-msg-bar" id="camera-msg">Initializing...</div>
  <div style="margin-top:1rem; display:flex; gap:0.5rem;">
    <button class="btn btn-outline" style="flex:1;" onclick="window.closeCamera()">Cancel</button>
    <button class="btn btn-primary" style="flex:1; display:none;" id="btn-pin-fallback">Use PIN</button>
  </div>
</dialog>
</body>
</html>
