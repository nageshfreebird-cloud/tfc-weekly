<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Summary — Teach for Change</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime">
    <span class="time-icon">🕐</span>
    <span id="live-clock">Loading...</span>
  </div>
</nav>

<div class="page">
  <div class="container-wide">

    <div class="flex-between" style="margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem;">
      <div>
        <h1 style="font-size:1.4rem;font-weight:800;color:var(--primary);">✏️ Meeting Summary Editor</h1>
        <p class="text-muted text-sm" id="week-label">Edit tasks before finalizing</p>
      </div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
        <a href="sheets.html" class="btn btn-ghost btn-sm">🔗 Google Sheet Links</a>
        <a href="dashboard.html" class="btn btn-ghost btn-sm">⚙️ Dashboard</a>
        <button class="btn btn-success" onclick="finalizeSummaryAction()">✅ Finalize & Go to Print</button>
      </div>
    </div>

    <div class="alert alert-info">
      ✏️ You can <strong>edit</strong> any task, <strong>add</strong> new tasks, or <strong>delete</strong> tasks for each member.
      When done, click <strong>Finalize & Go to Print</strong>.
    </div>

    <div id="saved-msg" class="alert alert-success hidden">✅ Changes auto-saved!</div>

    <!-- Member Summary Cards (generated by JS) -->
    <div id="summary-list"></div>

  </div>
</div>

<script type="module">
  import { startClock, requireManagerAuth, initials,
           formatWeekRange, formatShortDate } from "./js/utils.js";
  import { getWeekSettings, getWeekSubmissions, getSummary,
           saveSummary, finalizeSummary, getTeamMembers, getYearPlan } from "./js/db.js";

  if (!requireManagerAuth()) throw new Error("Not auth");
  startClock("live-clock");

  let _weekStart = "";
  let _summaryData = {}; // { memberName: { lastWeekReview, thisWeekTasks, supportNeeded } }
  let _team = [];
  const MONTHS = ["June", "July", "August", "September", "October", "November", "December", "January", "February", "March", "April", "May"];

  async function init() {
    _team = await getTeamMembers();
    const ws = await getWeekSettings();
    _weekStart = ws.weekStart;
    document.getElementById("week-label").textContent =
      `Week: ${formatWeekRange(ws.weekStart, ws.weekEnd)} | Meeting: ${formatShortDate(ws.meetingDay)}`;

    // Load submissions
    const subs = await getWeekSubmissions(ws.weekStart);

    // Load existing edited summary (if any)
    const existingSummary = await getSummary(ws.weekStart);

    // Build summary data: prefer existing edits, fallback to raw submission
    _team.forEach(name => {
      if (existingSummary && existingSummary.members && existingSummary.members[name]) {
        _summaryData[name] = existingSummary.members[name];
      } else if (subs[name]) {
        _summaryData[name] = {
          lastWeekReview: subs[name].lastWeekReview || [],
          thisWeekTasks:  subs[name].thisWeekTasks  || [],
          supportNeeded:  subs[name].supportNeeded  || ""
        };
      } else {
        _summaryData[name] = { lastWeekReview: [], thisWeekTasks: [], supportNeeded: "" };
      }
    });

    for (const name of _team) {
      _summaryData[name].yearPlan = await getYearPlan(name);
    }

    renderAll();
  }

  function renderAll() {
    const container = document.getElementById("summary-list");
    container.innerHTML = "";
    _team.forEach(name => {
      const div = renderMember(name, container);
      container.appendChild(div);
    });
  }

  function renderMember(name, container) {
    const data = _summaryData[name];
    const div  = document.createElement("div");
    div.className = "summary-member";
    div.id = `sm-${safeName(name)}`;

    // Header
    const hdr = document.createElement("div");
    hdr.className = "summary-member-header";
    hdr.innerHTML = `<span>${initials(name)}</span> ${name}`;
    div.appendChild(hdr);

    const mainFlex = document.createElement("div");
    mainFlex.style.display = "flex";
    mainFlex.style.gap = "1.5rem";
    mainFlex.style.flexWrap = "wrap";

    const body = document.createElement("div");
    body.className = "summary-member-body";
    body.style.flex = "1";
    body.style.minWidth = "300px";

    // ---- LAST WEEK REVIEW ----
    if (data.lastWeekReview && data.lastWeekReview.length > 0) {
      const secLabel = document.createElement("div");
      secLabel.className = "print-section-title";
      secLabel.textContent = "🗓️ Last Week Review";
      body.appendChild(secLabel);

      data.lastWeekReview.forEach((r, i) => {
        const row = document.createElement("div");
        row.className = "summary-task-row";
        const icon = r.status === "completed" ? "✅" : "🔄";
        row.innerHTML = `
          <span style="font-size:1rem;flex-shrink:0;">${icon}</span>
          <input type="text" value="${escVal(r.task)}"
            oninput="updateLastWeekTask('${safeName(name)}',${i},'task',this.value)"
            placeholder="Task..." />
          <button class="task-remove" title="Delete this task"
            onclick="deleteLastWeekTask('${safeName(name)}',${i})">✕</button>
        `;
        body.appendChild(row);
        if (r.status === "pending" && r.reason) {
          const rRow = document.createElement("div");
          rRow.style.cssText = "font-size:.8rem;color:var(--pending);padding:.15rem .5rem .4rem 2rem;";
          rRow.innerHTML = `📌 Reason: <input type="text" value="${escVal(r.reason)}"
            oninput="updateLastWeekTask('${safeName(name)}',${i},'reason',this.value)"
            style="border:1px dashed var(--pending);border-radius:4px;padding:.15rem .4rem;font-size:.8rem;color:var(--pending);outline:none;width:80%;" />`;
          body.appendChild(rRow);
        }
      });

      const addLW = document.createElement("button");
      addLW.className = "btn btn-ghost btn-sm";
      addLW.style.marginTop = ".3rem";
      addLW.textContent = "+ Add Last Week Task";
      addLW.onclick = () => addLastWeekTask(safeName(name), name);
      body.appendChild(addLW);
    }

    // ---- THIS WEEK TASKS ----
    const twLabel = document.createElement("div");
    twLabel.className = "print-section-title";
    twLabel.style.marginTop = ".85rem";
    twLabel.textContent = "📋 This Week Tasks";
    body.appendChild(twLabel);

    const tw = data.thisWeekTasks || [];
    const completedArr = data.thisWeekCompleted || [];
    tw.forEach((t, i) => {
      const isDone = completedArr[i] === true;
      const bg = isDone ? 'background:#f0fdf4;' : '';
      const check = isDone ? '<span style="color:var(--success);font-size:1.1rem;margin-right:0.4rem;" title="Completed by member">✅</span>' : '';
      const row = document.createElement("div");
      row.className = "summary-task-row";
      row.style.cssText = `align-items:center;${bg}`;
      row.innerHTML = `
        ${check}
        <input type="text" value="${escVal(t)}" style="${bg}"
          oninput="updateThisWeekTask('${safeName(name)}',${i},this.value)"
          placeholder="Task..." />
        <button class="task-remove" title="Delete"
          onclick="deleteThisWeekTask('${safeName(name)}',${i})">✕</button>
      `;
      body.appendChild(row);
    });

    const addTW = document.createElement("button");
    addTW.className = "btn btn-ghost btn-sm";
    addTW.style.marginTop = ".3rem";
    addTW.textContent = "+ Add This Week Task";
    addTW.onclick = () => addThisWeekTask(safeName(name), name);
    body.appendChild(addTW);

    // ---- SUPPORT ----
    if (data.supportNeeded) {
      const supLabel = document.createElement("div");
      supLabel.className = "print-section-title";
      supLabel.style.marginTop = ".85rem";
      supLabel.textContent = "🆘 Support Needed";
      body.appendChild(supLabel);
      const supRow = document.createElement("div");
      supRow.innerHTML = `<input type="text" class="form-control" value="${escVal(data.supportNeeded)}"
        oninput="updateSupport('${safeName(name)}',this.value)"
        placeholder="Support needed..." style="font-size:.87rem;" />`;
      body.appendChild(supRow);
    }

    mainFlex.appendChild(body);

    // ---- YEAR PLAN (Right side) ----
    const ypData = data.yearPlan || {};
    const ypCol = document.createElement("div");
    ypCol.style.flex = "0 0 350px";
    ypCol.style.minWidth = "300px";
    ypCol.style.background = "var(--bg-alt)";
    ypCol.style.border = "1px solid var(--border)";
    ypCol.style.borderRadius = "var(--radius-sm)";
    ypCol.style.padding = "1rem";
    ypCol.style.maxHeight = "500px";
    ypCol.style.overflowY = "auto";
    
    ypCol.innerHTML = `<div class="print-section-title" style="margin-top:0;margin-bottom:1rem;">🗓️ Year Plan</div>`;
    
    let hasPlan = false;
    MONTHS.forEach(m => {
      const tasks = ypData[m] || [];
      if (tasks.length > 0) {
        hasPlan = true;
        let taskHtml = tasks.map((t) => `<div class="text-sm text-muted" style="margin-top:0.3rem;">• ${escVal(t)}</div>`).join("");
        ypCol.innerHTML += `
          <div style="margin-bottom:1rem;">
            <div style="font-weight:600;font-size:0.9rem;border-bottom:1px solid var(--border);padding-bottom:0.2rem;">${m}</div>
            ${taskHtml}
          </div>
        `;
      }
    });

    if (!hasPlan) {
      ypCol.innerHTML += `<div class="text-sm text-muted">No year plan added yet.</div>`;
    }

    mainFlex.appendChild(ypCol);
    div.appendChild(mainFlex);
    return div;
  }

  // ---- Mutation helpers ----
  function getMemberByKey(key) {
    return _team.find(n => safeName(n) === key);
  }

  window.updateLastWeekTask = function(key, i, field, val) {
    const name = getMemberByKey(key);
    if (!name) return;
    _summaryData[name].lastWeekReview[i][field] = val;
    autoSave();
  };
  window.deleteLastWeekTask = function(key, i) {
    const name = getMemberByKey(key);
    if (!name) return;
    _summaryData[name].lastWeekReview.splice(i,1);
    reRenderMember(name);
    autoSave();
  };
  window.addLastWeekTask = function(key, name) {
    _summaryData[name].lastWeekReview.push({ task:"", status:"completed", reason:"" });
    reRenderMember(name);
    autoSave();
  };
  window.updateThisWeekTask = function(key, i, val) {
    const name = getMemberByKey(key);
    if (!name) return;
    _summaryData[name].thisWeekTasks[i] = val;
    autoSave();
  };
  window.deleteThisWeekTask = function(key, i) {
    const name = getMemberByKey(key);
    if (!name) return;
    _summaryData[name].thisWeekTasks.splice(i,1);
    reRenderMember(name);
    autoSave();
  };
  window.addThisWeekTask = function(key, name) {
    _summaryData[name].thisWeekTasks.push("");
    reRenderMember(name);
    autoSave();
  };
  window.updateSupport = function(key, val) {
    const name = getMemberByKey(key);
    if (!name) return;
    _summaryData[name].supportNeeded = val;
    autoSave();
  };

  function reRenderMember(name) {
    const old = document.getElementById(`sm-${safeName(name)}`);
    const container = document.getElementById("summary-list");
    const newDiv = renderMember(name, container);
    if (old) {
      old.replaceWith(newDiv);
    } else {
      container.appendChild(newDiv);
    }
  }

  let saveTimer = null;
  function autoSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      await saveSummary(_weekStart, _summaryData);
      const msg = document.getElementById("saved-msg");
      msg.classList.remove("hidden");
      setTimeout(() => msg.classList.add("hidden"), 2000);
    }, 800);
  }

  window.finalizeSummaryAction = async function() {
    await saveSummary(_weekStart, _summaryData);
    await finalizeSummary(_weekStart);
    window.location.href = "print.html";
  };

  function safeName(n) { return n.replace(/\s+/g,"_").replace(/[^a-zA-Z0-9_]/g,""); }
  function escVal(s)   { return String(s||"").replace(/"/g,"&quot;"); }

  init();
</script>
<script>
  window.toggleSidebar = function() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if(sidebar) sidebar.classList.toggle('active');
    if(overlay) overlay.classList.toggle('active');
  };
</script>
</body>
</html>
