<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Report — Teach for Change</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; }
      .navbar { display: none; }
      .print-report { padding: 0; }
    }
  </style>
</head>
<body>

<nav class="navbar no-print">
  <div class="navbar-brand">
    <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime">
    <span class="time-icon">🕐</span>
    <span id="live-clock">Loading...</span>
  </div>
</nav>

<!-- Action Bar -->
<div class="no-print" style="background:white;border-bottom:1.5px solid var(--border);padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;">
  <div style="display:flex;align-items:center;gap:1rem;">
    <a href="summary.html" class="btn btn-ghost btn-sm">← Edit Summary</a>
    <select id="past-weeks-select" class="form-control" style="width:200px;font-size:0.85rem;" onchange="loadSelectedWeek()">
      <option value="">Loading past weeks...</option>
    </select>
  </div>
  <div style="display:flex;gap:.6rem;">
    <a href="dashboard.html" class="btn btn-outline btn-sm">⚙️ Dashboard</a>
    <button class="btn btn-primary" onclick="window.print()">🖨️ Print / Save as PDF</button>
  </div>
</div>

<div class="page print-report" style="background:white;">
  <div style="max-width:720px;margin:0 auto;padding:1rem;">

    <!-- Print Header -->
    <div class="print-header" style="display:flex;align-items:center;gap:1.5rem;text-align:left;">
      <!-- Logo on left -->
      <div style="flex-shrink:0;">
        <img src="logo.png" alt="Teach for Change"
          style="width:90px;height:auto;object-fit:contain;" />
      </div>
      <!-- Title on right -->
      <div style="flex:1;">
        <h1 style="font-size:1.4rem;">TEACH FOR CHANGE</h1>
        <p id="print-subtitle" style="font-size:.9rem;">Weekly Review Meeting</p>
        <p id="print-week" style="font-weight:700;color:var(--primary);font-size:.95rem;margin-top:.2rem;"></p>
        <p id="print-meeting" style="color:var(--text-muted);font-size:.85rem;margin-top:.1rem;"></p>
        <p id="print-generated" style="color:var(--text-muted);font-size:.75rem;margin-top:.4rem;"></p>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading-state" style="text-align:center;padding:3rem;color:var(--text-muted);">
      Loading report...
    </div>

    <!-- Report Content -->
    <div id="report-content"></div>

    <!-- Footer -->
    <div id="print-footer" class="hidden" style="text-align:center;padding:1.5rem 0 0.5rem;border-top:1.5px solid var(--border);margin-top:1.5rem;font-size:.78rem;color:var(--text-muted);">
      Teach for Change NGO — Weekly Review System
    </div>

  </div>
</div>

<script type="module">
  import { startClock, requireManagerAuth, initials,
           formatWeekRange, formatShortDate, formatFullDate, formatTime, toYMD } from "./js/utils.js";
  import { getWeekSettings, getSummary, getWeekSubmissions, getTeamMembers } from "./js/db.js";

  if (!requireManagerAuth()) throw new Error("Not auth");
  startClock("live-clock");

  let currentWeekSettings = null;

  async function init() {
    currentWeekSettings = await getWeekSettings();
    populatePastWeeks(currentWeekSettings.weekStart);
    await loadWeekData(currentWeekSettings.weekStart, currentWeekSettings);
  }

  function populatePastWeeks(currentMondayStr) {
    const sel = document.getElementById("past-weeks-select");
    sel.innerHTML = "";
    
    const d = new Date(currentMondayStr + "T00:00:00");
    for (let i = 0; i < 15; i++) {
      const monStr = toYMD(d);
      const sat = new Date(d);
      sat.setDate(sat.getDate() + 5);
      const satStr = toYMD(sat);
      
      const opt = document.createElement("option");
      opt.value = monStr;
      opt.textContent = i === 0 ? `Current Week (${formatWeekRange(monStr, satStr)})` : formatWeekRange(monStr, satStr);
      sel.appendChild(opt);
      
      // Go back one week
      d.setDate(d.getDate() - 7);
    }
  }

  window.loadSelectedWeek = async function() {
    const selectedWeek = document.getElementById("past-weeks-select").value;
    document.getElementById("report-content").innerHTML = "";
    document.getElementById("loading-state").classList.remove("hidden");
    document.getElementById("print-footer").classList.add("hidden");
    
    // For past weeks, we don't have the specific meeting day / note saved, so we just pass null
    const settingsObj = (selectedWeek === currentWeekSettings.weekStart) ? currentWeekSettings : null;
    await loadWeekData(selectedWeek, settingsObj);
  };

  async function loadWeekData(weekStart, wsObject) {
    const now  = new Date();
    
    // Calculate end date (Saturday) for the header
    const d = new Date(weekStart + "T00:00:00");
    d.setDate(d.getDate() + 5);
    const weekEnd = toYMD(d);

    // Header
    document.getElementById("print-week").textContent = `📅 ${formatWeekRange(weekStart, weekEnd)}`;
    
    if (wsObject) {
      document.getElementById("print-meeting").textContent = 
        `Meeting Day: ${formatFullDate(wsObject.meetingDay)}` +
        (wsObject.teamNote ? `  |  Note: ${wsObject.teamNote}` : "");
    } else {
      document.getElementById("print-meeting").textContent = "Past Weekly Review";
    }
    
    document.getElementById("print-generated").textContent = `Generated: ${now.toLocaleString("en-IN")}`;

    // Get data: prefer finalized summary, fallback to raw submissions
    let data = {};
    const summary = await getSummary(weekStart);
    if (summary && summary.members) {
      data = summary.members;
    } else {
      const subs = await getWeekSubmissions(weekStart);
      const team = await getTeamMembers();
      team.forEach(name => {
        if (subs[name]) {
          data[name] = {
            lastWeekReview: subs[name].lastWeekReview || [],
            thisWeekTasks:  subs[name].thisWeekTasks  || [],
            supportNeeded:  subs[name].supportNeeded  || ""
          };
        } else {
          data[name] = null;
        }
      });
    }

    document.getElementById("loading-state").classList.add("hidden");
    renderReport(data);
    document.getElementById("print-footer").classList.remove("hidden");
  }

  async function renderReport(data) {
    const container = document.getElementById("report-content");
    container.innerHTML = "";
    const team = await getTeamMembers();

    // SECTION 1: This Week's Plan
    const sec1 = document.createElement("div");
    sec1.innerHTML = `<h2 style="font-size:1.2rem;margin-top:1rem;margin-bottom:1rem;border-bottom:2px solid var(--border);padding-bottom:.3rem;color:var(--text);">This Week's Plan</h2>`;
    
    team.forEach((name, idx) => {
      const d = data[name];
      const div = document.createElement("div");
      div.className = "print-member";

      const hdr = document.createElement("div");
      hdr.className = "print-member-name";
      hdr.textContent = `${idx + 1}. ${name.toUpperCase()}`;
      div.appendChild(hdr);

      const body = document.createElement("div");
      body.className = "print-member-body";

      if (!d) {
        body.innerHTML = `<p style="color:var(--text-muted);font-size:.87rem;font-style:italic;">⏳ Did not submit this week.</p>`;
      } else {
        // This week tasks
        if (d.thisWeekTasks && d.thisWeekTasks.length > 0) {
          const completedArr = d.thisWeekCompleted || [];
          d.thisWeekTasks.forEach((t, i) => {
            const isDone = completedArr[i] === true;
            const icon = isDone ? '✅ ' : '• ';
            const p = document.createElement("div");
            p.className = "print-task";
            if (isDone) p.style.cssText = "color:#666;";
            p.textContent = `${icon}${t}`;
            body.appendChild(p);
          });
        } else {
          body.innerHTML = `<p style="color:var(--text-muted);font-size:.87rem;font-style:italic;">No tasks planned for this week.</p>`;
        }

        // Support
        if (d.supportNeeded) {
          const sup = document.createElement("div");
          sup.style.cssText = "margin-top:.6rem;font-size:.82rem;color:var(--danger);";
          sup.innerHTML = `🆘 <strong>Support needed:</strong> ${escHtml(d.supportNeeded)}`;
          body.appendChild(sup);
        }
      }
      div.appendChild(body);
      sec1.appendChild(div);
    });
    container.appendChild(sec1);

    // SECTION 2: Last Week's Review
    const sec2 = document.createElement("div");
    sec2.innerHTML = `<h2 style="font-size:1.2rem;margin-top:2.5rem;margin-bottom:1rem;border-bottom:2px solid var(--border);padding-bottom:.3rem;color:var(--text);">Last Week's Review</h2>`;
    let hasLastWeek = false;

    team.forEach((name, idx) => {
      const d = data[name];
      if (!d || !d.lastWeekReview || d.lastWeekReview.length === 0) return;
      hasLastWeek = true;

      const div = document.createElement("div");
      div.className = "print-member";

      const hdr = document.createElement("div");
      hdr.className = "print-member-name";
      hdr.textContent = `${idx + 1}. ${name.toUpperCase()}`;
      div.appendChild(hdr);

      const body = document.createElement("div");
      body.className = "print-member-body";

      d.lastWeekReview.forEach(r => {
        const icon = r.status === "completed" ? "✅" : "🔄";
        const p = document.createElement("div");
        p.className = "print-task";
        p.innerHTML = `${icon} ${escHtml(r.task)}`;
        body.appendChild(p);
        if (r.status === "pending" && r.reason) {
          const rp = document.createElement("div");
          rp.className = "print-pending-reason";
          rp.textContent = `📌 Pending reason: ${r.reason}`;
          body.appendChild(rp);
        }
      });
      div.appendChild(body);
      sec2.appendChild(div);
    });

    if (hasLastWeek) {
      container.appendChild(sec2);
    }
  }

  function escHtml(s) {
    return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  init();
</script>
<script>
  window.toggleSidebar = function() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if(sidebar) sidebar.classList.toggle('active');
    if(overlay) overlay.classList.toggle('active');
  };
</script>
</body>
</html>
