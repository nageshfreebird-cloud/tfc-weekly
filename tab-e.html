<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔗 Google Sheet Links — Teach for Change</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
  
</script>
  <script src="./js/ui.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <meta property="og:title" content="Teach for Change - Weekly Review System">
  <meta property="og:description" content="Team Attendance, Assessments & Weekly Tasks">
  <meta property="og:image" content="logo.png">
  <meta property="og:type" content="website">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Toggle menu">&#9776;</button>
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" width="72" height="36" loading="lazy" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime" style="display:flex; align-items:center; gap:1rem;">
    <span id="welcome-name" style="font-weight:600; color:var(--primary);"></span>
    <div>
      <span class="time-icon">🕒</span>
      <span id="live-clock">Loading...</span>
    </div>
    
      <button class="theme-toggle" onclick="toggleTheme()" title="Dark Mode">&#127769;</button>
      <button class="btn btn-ghost btn-sm" onclick="window.doLogout()" style="color:var(--danger); border-color:var(--danger);">🚪 Logout</button>
  </div>
</nav>

<main class="page">
  <div class="container-wide">

        <!-- Sidebar Navigation -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
      <button class="sidebar-close" onclick="toggleSidebar()">&times;</button>
      <div class="sidebar-header">
        <img src="logo.png" alt="Logo" />
        <h2>Teach for Change</h2>
      </div>
      <div class="sidebar-nav">

      <a href="dashboard.html">⚙️ Dashboard</a>
      <a href="tab-a.html">📋 Weekly Tasks</a>
      <a href="manager-calls.html">📞 15-Days Teacher Calls</a>
      <a href="manager-assessments.html">📝 Assessments Received</a>
      <a href="manager-drive.html">📊 Assessments Analytics</a>
      <a href="sheets.html" class="active">🔗 Google Sheet Links</a>
      <a href="settings.html?v=ign">⚙️ My Settings</a>
    
      </div>
    </div>

    <div class="flex-between" style="margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem;">
      <div>
        <h1 style="font-size:1.4rem;font-weight:800;color:var(--primary);">🔗 Google Sheet Links</h1>
        <p class="text-muted text-sm">View Google Sheets registered by Field Supervisors</p>
      </div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
        <button class="theme-toggle" onclick="toggleTheme()" title="Dark Mode">&#127769;</button>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">🚪 Logout</button>
      </div>
    </div>

    <!-- Member List -->
    <div class="card" style="padding:1rem;">
      <div class="card-header" style="margin-bottom:.85rem;">
        <span class="icon">👥</span>
        <h2>Supervisor Sheets</h2>
      </div>
      <div id="links-list" style="display:flex;flex-direction:column;gap:0.5rem;">
        <div class="text-muted text-center">Loading links...</div>
      </div>
    </div>

  </div>
</main>

<script type="module">
  window.doLogout = async function() {
      if(typeof Swal !== 'undefined') Swal.fire({title:'Logging out...', allowOutsideClick:false, didOpen:()=>Swal.showLoading()});
      document.body.style.opacity = '0.5'; await signOutManager();
    sessionStorage.clear();
    window.location.href = "index.html";
  };

  import { requireManagerAuth, signOutManager } from "./js/auth.js";
  import { startClock } from "./js/utils.js";
  import { getUsers, getAllGoogleSheetLinks } from "./js/db.js?v=4";

  await requireManagerAuth();
  startClock("live-clock");

  async function init() {
    const users = await getUsers();
    const links = await getAllGoogleSheetLinks();
    
    const supervisors = users.filter(u => u.role === 'supervisor');
    const list = document.getElementById("links-list");
    
    if (supervisors.length === 0) {
      list.innerHTML = `<div class="text-muted text-center" style="padding:2rem;"><div class="empty-state"><div class="icon">📭</div><div class="title">Nothing to see here</div><div class="desc">Nosupervisors found. Please create a team member first.</div></div></div>`;
      return;
    }
    
    list.innerHTML = supervisors.map(supe => {
      const link = links[supe.name];
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:1rem;border:1px solid var(--border);border-radius:4px;background:var(--bg-alt);">
          <div style="display:flex;align-items:center;gap:1rem;">
            <div class="member-avatar" style="background:var(--primary);color:white;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:bold;">
              ${supe.name.substring(0,2).toUpperCase()}
            </div>
            <div>
              <div style="font-weight:bold;font-size:1.1rem;">${supe.name}</div>
              <div class="text-sm text-muted">${supe.districts ? supe.districts.join(", ") : "No districts"}</div>
            </div>
          </div>
          <div>
            ${link 
              ? `<a href="${link}" target="_blank" class="btn btn-success">🔗 Open Google Sheet</a>`
              : `<span class="badge badge-pending">No Link Provided</span>`
            }
          </div>
        </div>
      `;
    }).join("");
  }

  

  init();
</script>
<script>
  window.toggleSidebar = function() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if(sidebar) sidebar.classList.toggle('active');
    if(overlay) overlay.classList.toggle('active');
  };
</script>
</body>
</html>
