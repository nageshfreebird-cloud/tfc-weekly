<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15-Days Teacher Calls — Teach for Change</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .school-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .school-row-header {
      font-weight: 600;
      color: var(--primary);
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }
    .school-row-content {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 800px) {
      .school-row-content { grid-template-columns: 1fr; }
    }
    .topic-select {
      height: 80px;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime">
    <span id="welcome-name" style="margin-right:1rem;font-weight:600;"></span>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
  </div>
</nav>

<div class="page">
  <div class="container-wide" style="max-width: 1200px;">

    <!-- Navigation Tabs -->
    <div class="nav-tabs" style="margin-bottom:2rem;display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;">
      <a href="supervisor.html">⚙️ Dashboard</a>
      <a href="team.html">Weekly Tasks</a>
      <a href="supervisor-calls.html" class="active">📞 15-Days Teacher Calls</a>
      <a href="supervisor-assessments.html">📝 Assessments Received</a>
      <a href="supervisor-drive.html">📁 Assessments Record in Drive</a>
      <a href="supervisor-sheets.html">🔗 Google Sheet Links</a>
    </div>

    <div class="setup-panel">
      <h2>📞 15-Days Teacher Calls</h2>
      <p class="text-muted mb-3" style="margin-bottom:1.5rem;">Select your district and level to log calls for your assigned schools.</p>

      <div style="display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;">
        <div style="flex:1;">
          <label class="form-label">District</label>
          <select id="dist-select" class="form-control" onchange="loadSchools()">
            <option value="">Select District</option>
          </select>
        </div>
        <div style="flex:1;">
          <label class="form-label">Level</label>
          <select id="level-select" class="form-control" onchange="loadSchools()">
            <option value="">Select Level</option>
            <option value="Level-1">Level-1</option>
            <option value="Level-2">Level-2</option>
            <option value="Level-3">Level-3</option>
            <option value="Level-4">Level-4</option>
          </select>
        </div>
      </div>

      <div id="schools-container" style="background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:1.5rem;min-height:300px;">
        <div class="text-muted text-center" style="margin-top:2rem;">Please select a district and level above.</div>
      </div>

      <button id="save-btn" class="btn btn-primary btn-block hidden" style="margin-top:1.5rem;" onclick="saveCallsData()">💾 Save All Calls Data</button>

    </div>

  </div>
</div>

<script type="module">
  import { getUsers, getSchools, getSyllabus, getTeacherCalls, saveTeacherCalls } from "./js/db.js";

  const userName = sessionStorage.getItem("tfc_member_name");
  const userRole = sessionStorage.getItem("tfc_member_role");

  if (!userName || userRole !== 'supervisor') {
    window.location.href = "index.html";
  }

  document.getElementById("welcome-name").textContent = userName;

  let currentSchools = [];
  let currentSyllabus = [];
  let savedData = {};

  async function init() {
    const users = await getUsers();
    const myUser = users.find(u => u.name === userName);
    if (!myUser || !myUser.districts) return;

    const distEl = document.getElementById("dist-select");
    myUser.districts.forEach(d => distEl.innerHTML += `<option value="${d}">${d}</option>`);
  }

  window.loadSchools = async function() {
    const dist = document.getElementById("dist-select").value;
    const level = document.getElementById("level-select").value;
    const container = document.getElementById("schools-container");
    const saveBtn = document.getElementById("save-btn");

    if (!dist || !level) {
      container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">Please select a district and level above.</div>`;
      saveBtn.classList.add("hidden");
      return;
    }

    container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">Loading schools...</div>`;
    
    // Fetch data
    const allSchools = await getSchools(dist);
    currentSchools = allSchools.filter(s => s.Level === level);
    currentSyllabus = await getSyllabus(level);
    savedData = await getTeacherCalls(userName, `${dist}_${level}`);

    if (currentSchools.length === 0) {
      container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">No schools found in ${dist} for ${level}.</div>`;
      saveBtn.classList.add("hidden");
      return;
    }

    // Build syllabus options
    let sylOptions = `<option value="">-- None --</option>`;
    currentSyllabus.forEach(t => {
      sylOptions += `<option value="${t['Topic Name']}">${t['Topic Name']}</option>`;
    });

    let html = "";
    currentSchools.forEach((s, idx) => {
      const sName = s["School Name"] || "Unknown School";
      const tName = s["Teacher Name"] || "No Teacher";
      const tPhone = s["Teacher Phone"] || "No Phone";
      
      const prevData = savedData[sName] || {};
      const prevTopics = prevData.topics || [];
      const prevRemarks = prevData.remarks || "";
      const prevNotAnswered = prevData.notAnswered ? "checked" : "";

      html += `
        <div class="compact-row" id="row-${idx}" data-school="${sName}">
          <div class="compact-col-info">
            <strong>🏫 ${sName}</strong>
            <div class="text-sm text-muted">👤 ${tName} (${tPhone})</div>
          </div>
          
          <div class="compact-col-input" style="flex:1;">
            <select class="form-control topic-select" multiple style="height:60px;padding:0.25rem;">
              ${currentSyllabus.map(t => `<option value="${t['Topic Name']}" ${prevTopics.includes(t['Topic Name'])?'selected':''}>${t['Topic Name']}</option>`).join("")}
            </select>
          </div>
          
          <div class="compact-col-input" style="flex:1.5;">
            <textarea class="form-control remarks-input" style="height:60px;resize:none;padding:0.4rem;" 
                      placeholder="Enter remarks...">${prevRemarks}</textarea>
          </div>
          
          <div class="compact-col-input" style="flex:0 0 150px;">
            <label style="display:flex;align-items:center;gap:0.5rem;font-weight:600;color:var(--danger);cursor:pointer;font-size:0.85rem;">
              <input type="checkbox" class="no-answer-check" style="width:18px;height:18px;" ${prevNotAnswered} />
              No Answer
            </label>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
    saveBtn.classList.remove("hidden");
  };

  window.saveCallsData = async function() {
    const dist = document.getElementById("dist-select").value;
    const level = document.getElementById("level-select").value;
    if (!dist || !level) return;

    const rows = document.querySelectorAll(".compact-row");
    let newData = {};

    rows.forEach(row => {
      const sName = row.getAttribute("data-school");
      const topicSelect = row.querySelector(".topic-select");
      const selectedTopics = Array.from(topicSelect.selectedOptions).map(opt => opt.value);
      const remarks = row.querySelector(".remarks-input").value.trim();
      const notAnswered = row.querySelector(".no-answer-check").checked;

      newData[sName] = {
        topics: selectedTopics,
        remarks: remarks,
        notAnswered: notAnswered
      };
    });

    await saveTeacherCalls(userName, `${dist}_${level}`, newData);
    alert("Teacher calls data saved successfully!");
  };

  window.doLogout = function() {
    sessionStorage.removeItem("tfc_member_name");
    sessionStorage.removeItem("tfc_member_role");
    window.location.href = "index.html";
  };

  init();
</script>
</body>
</html>
