<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15-Days Teacher Calls — Teach for Change</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .school-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .school-row-header {
      font-weight: 600;
      color: var(--primary);
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }
    .school-row-content {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 800px) {
      .school-row-content { grid-template-columns: 1fr; }
    }
    .topic-select {
      height: 80px;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime">
    <span id="welcome-name" style="margin-right:1rem;font-weight:600;"></span>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
  </div>
</nav>

<div class="page">
  <div class="container-wide" style="max-width: 1200px;">

    <!-- Navigation Tabs -->
    <div class="nav-tabs" style="margin-bottom:2rem;display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;">
      <a href="supervisor.html">⚙️ Dashboard</a>
      <a href="team.html">📋 Weekly Tasks</a>
      <a href="supervisor-calls.html" class="active">📞 15-Days Teacher Calls</a>
      <a href="supervisor-assessments.html">📝 Assessments Received</a>
      <a href="supervisor-drive.html">📊 Assessments Analytics</a>
      <a href="supervisor-sheets.html">🔗 Google Sheet Links</a>
    </div>

    <div class="setup-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;">
        <h2>📞 15-Days Teacher Calls</h2>
        <div id="period-badge" class="badge badge-primary" style="font-size:0.9rem;">Loading period...</div>
      </div>
      <p class="text-muted mb-3" style="margin-bottom:1.5rem;">Select your district and level to log calls for your assigned schools.</p>

      <div style="display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;">
        <div style="flex:1;">
          <label class="form-label">District</label>
          <select id="dist-select" class="form-control" onchange="loadSchools()">
            <option value="">Select District</option>
          </select>
        </div>
        <div style="flex:1;">
          <label class="form-label">Level</label>
          <select id="level-select" class="form-control" onchange="loadSchools()">
            <option value="">Select Level</option>
            <option value="Level-1">Level-1</option>
            <option value="Level-2">Level-2</option>
            <option value="Level-3">Level-3</option>
            <option value="Level-4">Level-4</option>
          </select>
        </div>
      </div>

      <div id="schools-container" style="background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:1.5rem;min-height:300px;">
        <div class="text-muted text-center" style="margin-top:2rem;">Please select a district and level above.</div>
      </div>

    </div>

  </div>
</div>

<script type="module">
  import { getCurrent15DayPeriod } from "./js/utils.js";
  import { getUsers, getSchools, getSyllabus, getTeacherCalls, saveTeacherCalls } from "./js/db.js";

  const userName = sessionStorage.getItem("tfc_member_name");
  const userRole = sessionStorage.getItem("tfc_member_role");

  if (!userName || userRole !== 'supervisor') {
    window.location.href = "index.html";
  }

  document.getElementById("welcome-name").textContent = userName;

  let currentSchools = [];
  let currentSyllabus = [];
  let savedData = {};
  let currentPeriod = null;

  async function init() {
    currentPeriod = getCurrent15DayPeriod();
    document.getElementById("period-badge").textContent = "Current Period: " + currentPeriod.label;

    const users = await getUsers();
    const myUser = users.find(u => u.name === userName);
    if (!myUser || !myUser.districts) return;

    const distEl = document.getElementById("dist-select");
    myUser.districts.forEach(d => distEl.innerHTML += `<option value="${d}">${d}</option>`);
  }

  window.loadSchools = async function() {
    const dist = document.getElementById("dist-select").value;
    const level = document.getElementById("level-select").value;
    const container = document.getElementById("schools-container");

    if (!dist || !level) {
      container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">Please select a district and level above.</div>`;
      return;
    }

    container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">Loading schools...</div>`;
    
    // Fetch data for the current period
    const allSchools = await getSchools(dist);
    currentSchools = allSchools.filter(s => s.Level === level);
    currentSyllabus = await getSyllabus(level);
    window.allCallsData = await getTeacherCalls(userName, `${dist}_${level}`);
    if (typeof window.allCallsData !== 'object' || window.allCallsData === null) {
      window.allCallsData = {};
    }
    savedData = window.allCallsData[currentPeriod.label] || {};

    if (currentSchools.length === 0) {
      container.innerHTML = `<div class="text-muted text-center" style="margin-top:2rem;">No schools found in ${dist} for ${level}.</div>`;
      return;
    }

    let sylOptions = `<option value="">-- Optional --</option>`;
    currentSyllabus.forEach(t => {
      sylOptions += `<option value="${t['Topic Name']}">${t['Topic Name']}</option>`;
    });

    let html = "";
    currentSchools.forEach((s, idx) => {
      const sName = s["School Name"] || "Unknown School";
      const tName = s["Teacher Name"] || "No Teacher";
      const tPhone = s["Teacher Phone"] || "No Phone";
      
      const logs = Array.isArray(savedData[sName]) ? savedData[sName] : [];

      let buttonText = "Call";
      let logHtml = "";
      if (logs.length > 0) {
        if (logs.length === 1) {
          buttonText = "Call done";
        } else {
          buttonText = `Call ${logs.length} times`;
        }
        logHtml = `<div style="margin-top:0.5rem;padding:0.5rem;background:#f8f9fa;border-radius:4px;font-size:0.85rem;">
          <strong style="color:var(--text-muted);">Call History this period:</strong>
          <ul style="margin:0.25rem 0 0 1rem;padding:0;">
            ${logs.map(log => `
              <li style="margin-bottom:0.25rem;">
                <strong>${log.date}:</strong> ${log.syllabus ? `[${log.syllabus}]` : ''} ${log.remarks}
              </li>
            `).join("")}
          </ul>
        </div>`;
      }

      html += `
        <div class="card" style="margin-bottom:1rem;padding:1rem;" id="school-card-${idx}">
          <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
            
            <div style="flex: 0 0 25%;min-width:200px;">
              <strong>🏫 ${sName}</strong>
              <div class="text-sm text-muted">👤 ${tName} (${tPhone})</div>
            </div>
            
            <div style="flex: 0 0 18%;min-width:140px;">
              <input type="date" class="form-control call-date" 
                     min="${currentPeriod.startDate}" max="${currentPeriod.endDate}" 
                     style="font-size:0.85rem;" title="Select Call Date" />
            </div>
            
            <div style="flex: 0 0 18%;min-width:140px;">
              <select class="form-control call-syllabus" style="font-size:0.85rem;">
                ${sylOptions}
              </select>
            </div>
            
            <div style="flex: 1;min-width:200px;">
              <input type="text" class="form-control call-remarks" placeholder="Optional remarks..." style="font-size:0.85rem;" />
            </div>
            
            <div style="flex: 0 0 5%;min-width:110px;text-align:right;">
              <button class="btn btn-success btn-sm" id="btn-${idx}" onclick="addCallLog('${sName.replace(/'/g, "\\'")}', ${idx})">${buttonText}</button>
            </div>
            
          </div>
          ${logHtml}
        </div>
      `;
    });

    container.innerHTML = html;
  };

  window.addCallLog = async function(schoolName, idx) {
    const dist = document.getElementById("dist-select").value;
    const level = document.getElementById("level-select").value;
    if (!dist || !level) return;

    const card = document.getElementById(`school-card-${idx}`);
    const dateVal = card.querySelector(".call-date").value;
    const sylVal = card.querySelector(".call-syllabus").value;
    const remarksVal = card.querySelector(".call-remarks").value.trim();

    if (!dateVal) {
      alert("Please select a date first!");
      return;
    }

    const btn = document.getElementById(`btn-${idx}`);
    btn.textContent = "⏳ Saving...";
    btn.disabled = true;

    // Append to logs
    if (!Array.isArray(savedData[schoolName])) {
      savedData[schoolName] = [];
    }
    
    savedData[schoolName].push({
      date: dateVal,
      syllabus: sylVal,
      remarks: remarksVal
    });

    window.allCallsData[currentPeriod.label] = savedData;

    try {
      // Save to DB under this period
      await saveTeacherCalls(userName, `${dist}_${level}`, window.allCallsData);
      
      // Rerender to show new log and clear inputs
      loadSchools();
    } catch (err) {
      console.error(err);
      alert("Error saving: " + err.message);
      btn.textContent = "Call";
      btn.disabled = false;
    }
  };

  window.doLogout = function() {
    sessionStorage.removeItem("tfc_member_name");
    sessionStorage.removeItem("tfc_member_role");
    window.location.href = "index.html";
  };

  init();
</script>
</body>
</html>
