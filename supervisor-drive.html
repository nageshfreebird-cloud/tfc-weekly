<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Data Entry — Teach for Change</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: white;
    }
    .grid-table th, .grid-table td {
      border: 1px solid var(--border);
      padding: 0;
    }
    .grid-table th {
      background: var(--primary);
      color: white;
      padding: 0.5rem;
      font-size: 0.85rem;
      text-align: center;
    }
    .grid-table input {
      width: 100%;
      border: none;
      padding: 0.5rem;
      text-align: center;
      box-sizing: border-box;
      outline: none;
    }
    .grid-table input:focus {
      background: #eef2ff;
    }
    .grid-table .col-name, .grid-table .col-remarks {
      text-align: left;
    }
    .grid-table .col-total {
      background: #fff3cd;
      font-weight: bold;
    }
    .class-tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--primary);
      margin-bottom: 1rem;
    }
    .class-tab {
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      font-weight: 600;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      color: var(--text-muted);
    }
    .class-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .filter-bar {
      display: flex;
      gap: 1rem;
      background: var(--bg-alt);
      padding: 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filter-bar > div { flex: 1; min-width: 150px; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime">
    <span id="welcome-name" style="margin-right:1rem;font-weight:600;"></span>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
  </div>
</nav>

<div class="page">
  <div class="container-wide" style="max-width: 1200px;">

    <div class="nav-tabs" style="margin-bottom:2rem;display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;">
      <a href="supervisor.html">⚙️ Dashboard</a>
      <a href="team.html">📋 Weekly Tasks</a>
      <a href="supervisor-calls.html">📞 15-Days Teacher Calls</a>
      <a href="supervisor-assessments.html">📝 Assessments Received</a>
      <a href="supervisor-drive.html" class="active">📊 Assessments Analytics</a>
      <a href="supervisor-sheets.html">🔗 Google Sheet Links</a>
    </div>

    <div class="setup-panel">
      <h2>📊 Student Assessment Data Entry</h2>
      
      <div class="filter-bar">
        <div>
          <label class="form-label">District</label>
          <select id="sel-dist" class="form-control" onchange="loadSchools()"><option value="">Select District</option></select>
        </div>
        <div>
          <label class="form-label">Level</label>
          <select id="sel-level" class="form-control" onchange="loadSchools()">
            <option value="Level-1">Level-1</option>
            <option value="Level-2">Level-2</option>
            <option value="Level-3">Level-3</option>
            <option value="Level-4">Level-4</option>
          </select>
        </div>
        <div>
          <label class="form-label">School</label>
          <select id="sel-school" class="form-control" onchange="loadGrid()"><option value="">Select School</option></select>
        </div>
        <div>
          <label class="form-label">Term</label>
          <select id="sel-term" class="form-control" onchange="loadGrid()">
            <option value="baseline">Baseline</option>
            <option value="midline">Midline</option>
            <option value="endline">Endline</option>
          </select>
        </div>
      </div>

      <div id="grid-container" style="display:none;">
        <div class="class-tabs">
          <div class="class-tab active" onclick="switchClass('3rd class')">3rd Class</div>
          <div class="class-tab" onclick="switchClass('4th class')">4th Class</div>
          <div class="class-tab" onclick="switchClass('5th class')">5th Class</div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
          <p class="text-sm text-muted">Enter student names and marks. You can paste data directly from Excel.</p>
          <div style="display:flex;gap:0.5rem;">
            <button class="btn btn-outline btn-sm" onclick="downloadTemplate()">⬇️ Download Template</button>
            <button class="btn btn-outline btn-sm" onclick="document.getElementById('upload-excel').click()">⬆️ Upload Excel</button>
            <input type="file" id="upload-excel" accept=".xlsx" style="display:none;" onchange="handleExcelUpload(event)" />
          </div>
        </div>

        <div style="overflow-x:auto;">
          <table class="grid-table" id="student-grid">
            <thead id="grid-head">
              <!-- Dynamically populated -->
            </thead>
            <tbody id="grid-body">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
        
        <div style="margin-top:1rem;display:flex;justify-content:space-between;">
          <button class="btn btn-outline btn-sm" onclick="addRow()">+ Add Row</button>
          <button class="btn btn-primary" onclick="saveGrid()" id="btn-save">💾 Save Data</button>
        </div>
      </div>
      
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
  import { getUsers, getSchools, getSchemaForLevel, saveStudentAssessments, getStudentAssessments } from "./js/db.js";

  const userName = sessionStorage.getItem("tfc_member_name");
  const userRole = sessionStorage.getItem("tfc_member_role");

  if (!userName || userRole !== 'supervisor') {
    window.location.href = "index.html";
  }

  document.getElementById("welcome-name").textContent = "👋 " + userName;

  let myUser = null;
  let currentClass = "3rd class";
  let currentGridData = [];
  let currentSchema = [];

  window.doLogout = function() {
    sessionStorage.clear();
    window.location.href = "index.html";
  };

  async function init() {
    const users = await getUsers();
    myUser = users.find(u => u.name === userName);
    if (!myUser || !myUser.districts) return alert("No districts assigned.");

    const distSel = document.getElementById("sel-dist");
    myUser.districts.forEach(d => distSel.innerHTML += `<option value="${d}">${d}</option>`);
  }

  window.loadSchools = async function() {
    const dist = document.getElementById("sel-dist").value;
    const lvl = document.getElementById("sel-level").value;
    const schSel = document.getElementById("sel-school");
    schSel.innerHTML = '<option value="">Select School</option>';
    document.getElementById("grid-container").style.display = "none";
    
    if (!dist) return;
    
    let schools = await getSchools(dist);
    schools = schools.filter(s => s.Level === lvl);
    
    schools.forEach(s => {
      schSel.innerHTML += `<option value="${s['School Name']}">${s['School Name']}</option>`;
    });
  };

  window.switchClass = function(clsName) {
    document.querySelectorAll('.class-tab').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
    currentClass = clsName;
    loadGrid();
  };

  function renderHeaders() {
    const lvl = document.getElementById("sel-level").value;
    currentSchema = getSchemaForLevel(lvl);
    
    const thead = document.getElementById("grid-head");
    let html = `<tr>
      <th style="width:50px;">S.No</th>
      <th style="width:200px;">Student Name</th>`;
    
    currentSchema.forEach(param => {
      html += `<th>${param.label}<br/>(${param.maxMarks})</th>`;
    });
    
    html += `<th>TOTAL (50)</th><th style="width:150px;">Comprehension Level</th></tr>`;
    thead.innerHTML = html;
  }

  window.loadGrid = async function() {
    const dist = document.getElementById("sel-dist").value;
    const school = document.getElementById("sel-school").value;
    
    if (!dist || !school) {
      document.getElementById("grid-container").style.display = "none";
      return;
    }
    
    document.getElementById("grid-container").style.display = "block";
    renderHeaders();
    
    const data = await getStudentAssessments(dist, school, currentClass);
    
    currentGridData = [];
    if (data.length === 0) {
      for(let i=1; i<=10; i++) currentGridData.push({ sno: i, name: "", scores: {} });
    } else {
      currentGridData = JSON.parse(JSON.stringify(data));
    }
    
    drawGrid();
  };

  function drawGrid() {
    const tbody = document.getElementById("grid-body");
    const term = document.getElementById("sel-term").value;
    tbody.innerHTML = "";
    
    currentGridData.forEach((row, rIdx) => {
      let tr = document.createElement("tr");
      
      tr.innerHTML += `<td><input type="text" data-row="${rIdx}" data-col="sno" value="${row.sno || ''}" onchange="updateData(this)" onpaste="handlePaste(event, this)"/></td>`;
      tr.innerHTML += `<td><input type="text" class="col-name" data-row="${rIdx}" data-col="name" value="${row.name || ''}" onchange="updateData(this)" onpaste="handlePaste(event, this)"/></td>`;
      
      let total = 0;
      currentSchema.forEach((param, cIdx) => {
        let val = "";
        if (row[term] && row[term][param.id] !== undefined) {
          val = row[term][param.id];
          total += Number(val);
        }
        tr.innerHTML += `<td><input type="number" min="0" max="${param.maxMarks}" data-row="${rIdx}" data-col="${param.id}" value="${val}" onchange="updateData(this)" onpaste="handlePaste(event, this)"/></td>`;
      });
      
      tr.innerHTML += `<td><input type="text" class="col-total" readonly value="${total || ''}"/></td>`;
      
      // Remarks
      let remark = "";
      if (row[term] && row[term].remarks !== undefined) remark = row[term].remarks;
      tr.innerHTML += `<td><input type="text" class="col-remarks" data-row="${rIdx}" data-col="remarks" value="${remark}" onchange="updateData(this)" onpaste="handlePaste(event, this)"/></td>`;
      
      tbody.appendChild(tr);
    });
  }

  window.updateData = function(inputEl) {
    const rIdx = inputEl.getAttribute("data-row");
    const col = inputEl.getAttribute("data-col");
    const term = document.getElementById("sel-term").value;
    
    if (col === "sno" || col === "name") {
      currentGridData[rIdx][col] = inputEl.value;
    } else {
      if (!currentGridData[rIdx][term]) currentGridData[rIdx][term] = {};
      currentGridData[rIdx][term][col] = inputEl.value;
      
      let total = 0;
      currentSchema.forEach(param => {
        if (currentGridData[rIdx][term] && currentGridData[rIdx][term][param.id]) {
          total += Number(currentGridData[rIdx][term][param.id]);
        }
      });
      inputEl.closest("tr").querySelector(".col-total").value = total || "";
    }
  };

  window.addRow = function() {
    currentGridData.push({ sno: currentGridData.length + 1, name: "", scores: {} });
    drawGrid();
  };

  window.handlePaste = function(e, inputEl) {
    e.preventDefault();
    const pasteData = (e.clipboardData || window.clipboardData).getData('text');
    const rows = pasteData.split(/\r?\n/).filter(r => r.trim() !== "");
    const startRow = parseInt(inputEl.getAttribute("data-row"));
    const colName = inputEl.getAttribute("data-col");
    let startColIdx = 0;
    
    if (colName === "name") startColIdx = 1;
    else if (colName === "remarks") startColIdx = 2 + currentSchema.length;
    else if (colName !== "sno") {
      startColIdx = 2 + currentSchema.findIndex(p => p.id === colName);
    }
    const term = document.getElementById("sel-term").value;

    rows.forEach((rowStr, i) => {
      const cells = rowStr.split('\t');
      const rIdx = startRow + i;
      while(rIdx >= currentGridData.length) currentGridData.push({ sno: currentGridData.length + 1, name: "", scores: {} });
      
      cells.forEach((cellVal, j) => {
        const cIdx = startColIdx + j;
        const val = cellVal.trim();
        if (cIdx === 0) currentGridData[rIdx].sno = val;
        else if (cIdx === 1) currentGridData[rIdx].name = val;
        else if (cIdx >= 2 && cIdx < 2 + currentSchema.length) {
          const paramId = currentSchema[cIdx-2].id;
          if (!currentGridData[rIdx][term]) currentGridData[rIdx][term] = {};
          currentGridData[rIdx][term][paramId] = val;
        }
        else if (cIdx === 2 + currentSchema.length) { // past the total column technically, or just past parameters
          // Wait, Excel has TOTAL column. So Remarks is actually at 2 + schema.length + 1
        }
      });
    });
    
    // Proper paste logic for Remarks considering Total column offset:
    // If they copy from Excel, Excel has TOTAL at index `2 + schema.length`.
    // Remarks is at `2 + schema.length + 1`.
    rows.forEach((rowStr, i) => {
      const cells = rowStr.split('\t');
      const rIdx = startRow + i;
      cells.forEach((cellVal, j) => {
        const cIdx = startColIdx + j;
        const val = cellVal.trim();
        if (cIdx === 3 + currentSchema.length) { // 2 params + schema length + 1 (total) = 3 + length
           if (!currentGridData[rIdx][term]) currentGridData[rIdx][term] = {};
           currentGridData[rIdx][term].remarks = val;
        }
      });
    });

    drawGrid();
  };

  window.saveGrid = async function() {
    const dist = document.getElementById("sel-dist").value;
    const school = document.getElementById("sel-school").value;
    const btn = document.getElementById("btn-save");
    const validData = currentGridData.filter(r => r.name && r.name.trim() !== "");
    
    btn.textContent = "Saving...";
    btn.disabled = true;
    try {
      await saveStudentAssessments(dist, school, currentClass, validData);
      alert("Saved successfully!");
      await loadGrid();
    } catch(err) {
      alert("Error saving data");
      console.error(err);
    }
    btn.textContent = "💾 Save Data";
    btn.disabled = false;
  };

  window.downloadTemplate = function() {
    const term = document.getElementById("sel-term").value;
    const headers = ["S.No", "Student Name"];
    currentSchema.forEach(p => headers.push(`${p.label} (${p.maxMarks})`));
    headers.push("Total (50)", "Comprehension Level");
    
    const exportData = [];
    currentGridData.forEach(r => {
      if (!r.name) return;
      let row = [r.sno, r.name];
      let total = 0;
      currentSchema.forEach(p => {
        let val = r[term] && r[term][p.id] ? r[term][p.id] : "";
        row.push(val);
        if (val) total += Number(val);
      });
      row.push(total);
      row.push(r[term] && r[term].remarks ? r[term].remarks : "");
      exportData.push(row);
    });
    if (exportData.length === 0) exportData.push([1, "", "", "", "", "", "", ""]);

    const ws = XLSX.utils.aoa_to_sheet([headers, ...exportData]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Students");
    XLSX.writeFile(wb, `${document.getElementById("sel-school").value}_${currentClass}_${term}.xlsx`);
  };

  window.handleExcelUpload = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const term = document.getElementById("sel-term").value;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const bstr = evt.target.result;
      const wb = XLSX.read(bstr, { type: 'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
      
      for (let i = 1; i < data.length; i++) {
        let rowData = data[i];
        if (!rowData || rowData.length === 0) continue;
        let sno = rowData[0];
        let name = rowData[1];
        if (!name) continue;
        
        let rIdx = currentGridData.findIndex(r => r.name === name || r.sno == sno);
        if (rIdx === -1) {
          rIdx = currentGridData.length;
          currentGridData.push({ sno: sno || rIdx+1, name: name });
        }
        if (!currentGridData[rIdx][term]) currentGridData[rIdx][term] = {};
        
        currentSchema.forEach((param, pIdx) => {
          let score = rowData[2 + pIdx];
          if (score !== undefined && score !== "") currentGridData[rIdx][term][param.id] = score;
        });
        
        // remarks is after schema and total
        let remarks = rowData[2 + currentSchema.length + 1];
        if (remarks !== undefined && remarks !== "") currentGridData[rIdx][term].remarks = remarks;
      }
      drawGrid();
      e.target.value = "";
      alert("Excel data mapped successfully! Click Save Data when ready.");
    };
    reader.readAsBinaryString(file);
  };

  init();
</script>
</body>
</html>
