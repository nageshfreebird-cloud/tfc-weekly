<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Dashboard — Teach for Change</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
    <img src="logo.png" alt="Teach for Change" style="height:36px;width:auto;object-fit:contain;" />
    <span style="font-size:.95rem;">Teach for Change</span>
  </div>
  <div class="navbar-datetime">
    <span class="time-icon">🕐</span>
    <span id="live-clock">Loading...</span>
  </div>
</nav>

<div class="page">
  <div class="container-wide">

    <!-- Top bar -->
    <div class="flex-between" style="margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem;">
      <div>
        <h1 style="font-size:1.4rem;font-weight:800;color:var(--primary);">📊 Manager Dashboard</h1>
        <p class="text-muted text-sm">Live submission status for this week</p>
      </div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
        <a href="settings.html" class="btn btn-ghost btn-sm">⚙️ Settings</a>
        <a href="summary.html" class="btn btn-outline btn-sm">✏️ Edit Summary</a>
        <a href="print.html" class="btn btn-warning btn-sm">🖨️ Print Report</a>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <!-- Week Bar -->
    <div class="week-bar" id="week-bar">
      <div>
        <div class="week-label">Current Week</div>
        <div class="week-dates" id="week-dates">—</div>
      </div>
      <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;">
        <div class="meeting-day" id="meeting-day-display">Meeting: —</div>
        <div id="note-badge" class="badge badge-pending hidden" style="font-size:.78rem;"></div>
      </div>
    </div>

    <!-- Submissions Toggle + Stats -->
    <div class="card" style="margin-bottom:1rem;">
      <div class="flex-between" style="flex-wrap:wrap;gap:1rem;">
        <div class="toggle-wrap">
          <span class="toggle-label">Submissions:</span>
          <label class="toggle" title="Open or close submissions for team">
            <input type="checkbox" id="submissions-toggle" onchange="toggleSubmissions(this.checked)" />
            <span class="toggle-slider"></span>
          </label>
          <span id="toggle-status" class="badge badge-gray">Closed</span>
          <span class="live-dot" id="live-dot" style="display:none;"></span>
        </div>
        <div style="font-size:.82rem;color:var(--text-muted);">
          <span id="submit-count">0</span> of 9 submitted
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar" style="margin-bottom:1.25rem;">
      <div class="stat-box">
        <div class="stat-num" id="stat-total">9</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-box green">
        <div class="stat-num" id="stat-done">0</div>
        <div class="stat-label">Submitted</div>
      </div>
      <div class="stat-box orange">
        <div class="stat-num" id="stat-pending">9</div>
        <div class="stat-label">Pending</div>
      </div>
    </div>

    <!-- Member List -->
    <div class="card" style="padding:1rem;">
      <div class="card-header" style="margin-bottom:.85rem;">
        <span class="icon">👥</span>
        <h2>Team Submissions</h2>
        <span class="live-dot" style="margin-left:auto;"></span>
        <span class="text-sm text-muted" style="margin-left:.4rem;">Live</span>
      </div>
      <div id="member-list"></div>
    </div>

    <!-- Member Detail Panel (Modal) -->
    <div id="detail-overlay" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:1rem;">
      <div id="detail-panel" class="card animate-in" style="width:100%;max-width:500px;max-height:90vh;overflow-y:auto;margin:0;">
        <div class="flex-between" style="margin-bottom:1rem;">
          <h2 id="detail-name" style="font-size:1.1rem;font-weight:800;color:var(--primary);"></h2>
          <button class="btn btn-ghost btn-sm" onclick="closeDetail()">✕ Close</button>
        </div>
        <div id="detail-content"></div>
      </div>
    </div>

  </div>
</div>

<script type="module">
  import { startClock, requireManagerAuth, clearManagerSession,
           initials, formatFullDate, formatWeekRange, formatTime } from "./js/utils.js";
  import { listenWeekSettings, listenWeekSubmissions, setSubmissionsOpen, getTeamMembers, deleteMemberSubmission } from "./js/db.js";

  if (!requireManagerAuth()) throw new Error("Not auth");
  startClock("live-clock");

  let _weekStart = null;
  let _submissions = {};
  let _team = [];

  async function init() {
    _team = await getTeamMembers();
    // Render initially empty
    renderMemberList({});

    // Listen to week settings
    listenWeekSettings(settings => {
    if (!settings) return;
    _weekStart = settings.weekStart;
    document.getElementById("week-dates").textContent = formatWeekRange(settings.weekStart, settings.weekEnd);
    document.getElementById("meeting-day-display").textContent = "Meeting: " + formatFullDate(settings.meetingDay);

    const noteEl = document.getElementById("note-badge");
    if (settings.teamNote) {
      noteEl.textContent = "📢 " + settings.teamNote;
      noteEl.classList.remove("hidden");
    } else noteEl.classList.add("hidden");

    const tog = document.getElementById("submissions-toggle");
    const st  = document.getElementById("toggle-status");
    const dot = document.getElementById("live-dot");
    tog.checked = settings.submissionsOpen;
    if (settings.submissionsOpen) {
      st.className = "badge badge-success"; st.textContent = "Open";
      dot.style.display = "inline-block";
    } else {
      st.className = "badge badge-gray"; st.textContent = "Closed";
      dot.style.display = "none";
    }

    // Start listening submissions once we have weekStart
    startListeningSubmissions(settings.weekStart);
  });
  }

  let _unsubSub = null;
  function startListeningSubmissions(weekStart) {
    if (_unsubSub) _unsubSub();
    _unsubSub = listenWeekSubmissions(weekStart, subs => {
      _submissions = subs;
      renderMemberList(subs);
    });
  }

  function renderMemberList(subs) {
    const done = Object.keys(subs).length;
    document.getElementById("submit-count").textContent = done;
    document.getElementById("stat-done").textContent = done;
    document.getElementById("stat-pending").textContent = 9 - done;

    const list = document.getElementById("member-list");
    list.innerHTML = "";
    const totalCount = _team.length;
    document.getElementById("submit-count").textContent = done;
    document.getElementById("stat-done").textContent = done;
    document.getElementById("stat-pending").textContent = totalCount - done;
    document.getElementById("stat-total").textContent = totalCount;

    _team.forEach(name => {
      const sub = subs[name];
      const row = document.createElement("div");
      row.className = "member-row " + (sub ? "submitted" : "pending-row");
      row.onclick = () => showDetail(name, sub);
      const timeStr = sub ? formatTime(new Date(sub.submittedAt)) : "";
      row.innerHTML = `
        <div class="member-info">
          <div class="member-avatar">${initials(name)}</div>
          <div>
            <div class="member-name">${name}</div>
            <div class="member-time">${sub ? "Submitted at " + timeStr : "Not yet submitted"}</div>
          </div>
        </div>
        <div class="member-status">
          ${sub
            ? '<span class="badge badge-success">✅ Submitted</span>'
            : '<span class="badge badge-gray">⏳ Pending</span>'
          }
          <span style="color:var(--text-muted);font-size:1rem;">›</span>
        </div>
      `;
      list.appendChild(row);
    });
  }

  function showDetail(name, sub) {
    const panel = document.getElementById("detail-panel");
    document.getElementById("detail-name").textContent = `👤 ${name}`;
    if (!sub) {
      document.getElementById("detail-content").innerHTML =
        `<div class="alert alert-warning">⏳ ${name} has not submitted yet.</div>`;
    } else {
      let html = "";
      // Last week review
      if (sub.lastWeekReview && sub.lastWeekReview.length > 0) {
        html += `<div class="section-divider"><span>Last Week Review</span></div>`;
        sub.lastWeekReview.forEach((r,i) => {
          const icon = r.status === "completed" ? "✅" : "🔄";
          html += `<div style="padding:.5rem .25rem;border-bottom:1px solid var(--border);">
            <span style="font-size:.85rem;font-weight:600;">${icon} ${escHtml(r.task)}</span>
            ${r.reason ? `<div style="font-size:.8rem;color:var(--pending);margin-top:.2rem;">📌 ${escHtml(r.reason)}</div>` : ""}
          </div>`;
        });
      }
      // This week tasks
      if (sub.thisWeekTasks && sub.thisWeekTasks.length > 0) {
        html += `<div class="section-divider"><span>This Week Plan</span></div>`;
        const completedArr = sub.thisWeekCompleted || [];
        sub.thisWeekTasks.forEach((t,i) => {
          const isDone = completedArr[i] === true;
          const style = isDone ? 'text-decoration:line-through;color:var(--text-muted);' : '';
          const icon = isDone ? '✅ ' : `${i+1}. `;
          html += `<div style="padding:.35rem .25rem;font-size:.88rem;${style}">${icon}${escHtml(t)}</div>`;
        });
      }
      // Support
      if (sub.supportNeeded) {
        html += `<div class="alert alert-warning" style="margin-top:.85rem;">🆘 <strong>Support needed:</strong> ${escHtml(sub.supportNeeded)}</div>`;
      }
      // Delete Submission Button
      html += `
        <div style="margin-top:1.5rem;text-align:right;">
          <button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger);" onclick="deleteSub('${name}')">
            🗑️ Delete Submission (Allow Re-entry)
          </button>
        </div>
      `;
      document.getElementById("detail-content").innerHTML = html || "<p class='text-muted'>No data available.</p>";
    }
    document.getElementById("detail-overlay").classList.remove("hidden");
  }

  window.deleteSub = async function(name) {
    if (!confirm(`Are you sure you want to delete ${name}'s submission? They will have to re-enter their tasks.`)) return;
    try {
      await deleteMemberSubmission(_weekStart, name);
      closeDetail();
    } catch(err) {
      alert("Error deleting submission: " + err.message);
    }
  };

  window.closeDetail = function() {
    document.getElementById("detail-overlay").classList.add("hidden");
  };

  window.toggleSubmissions = async function(isOpen) {
    try { await setSubmissionsOpen(isOpen); }
    catch(e) { alert("Error: " + e.message); }
  };

  window.doLogout = function() {
    clearManagerSession();
    window.location.href = "index.html";
  };

  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  init();
</script>
<script>
  window.toggleSidebar = function() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    if(sidebar) sidebar.classList.toggle('active');
    if(overlay) overlay.classList.toggle('active');
  };
</script>
</body>
</html>
